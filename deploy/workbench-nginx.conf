events {}

http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=workbench_health:1m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=workbench_knowledge_tool:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=workbench_canvas_tool:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=workbench_canvas_visual:1m rate=20r/s;
  map $http_x_forwarded_proto $workbench_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }

  upstream workbench_web {
    server workbench-web:3000;
    keepalive 32;
  }

  upstream workbench_knowledge {
    server knowledge:3000;
    keepalive 8;
  }

  upstream workbench_api {
    server workbench-api:4100;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 16m;

    location = /healthz {
      access_log off;
      limit_req zone=workbench_health burst=2 nodelay;
      proxy_pass http://workbench_web/api/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Workbench-Client-IP "";
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header Connection "";
    }

    location = /knowledge {
      return 308 /knowledge/;
    }

    location /knowledge/ {
      proxy_pass http://workbench_knowledge/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Forwarded-Prefix /knowledge;
      proxy_set_header X-Workbench-Client-IP "";
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # DeerFlow's trusted server-side tool reaches exactly this scoped capability
    # endpoint over the deployment's HTTPS origin. It bypasses the browser BFF,
    # never accepts cookies, and forwards only the short-lived bearer grant.
    location = /api/v1/runtime/knowledge/retrieve {
      limit_except POST {
        deny all;
      }
      client_max_body_size 16k;
      limit_req zone=workbench_knowledge_tool burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://workbench_api/api/v1/runtime/knowledge/retrieve;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Accept $http_accept;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_set_header Cookie "";
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Workbench-Client-IP "";
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
    }

    # Canvas capability calls are server-to-server and must bypass the browser
    # BFF. Only this exact endpoint receives the short-lived bearer grant.
    location = /api/v1/runtime/canvas/tools/execute {
      limit_except POST {
        deny all;
      }
      client_max_body_size 64k;
      limit_req zone=workbench_canvas_tool burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://workbench_api/api/v1/runtime/canvas/tools/execute;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Accept $http_accept;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_set_header Cookie "";
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Workbench-Client-IP "";
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
    }

    # A visual capability is a single command-bound image object. Collection
    # and nested paths stay on the browser boundary and never receive bearer.
    location ~ "^/api/v1/runtime/canvas/visuals/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" {
      limit_except GET {
        deny all;
      }
      limit_req zone=workbench_canvas_visual burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://workbench_api;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header If-None-Match $http_if_none_match;
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Workbench-Client-IP "";
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header Cookie "";
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
    }

    # Run events are long-lived SSE responses. Buffering or compression here
    # would delay progress events and break timely reconnect behavior.
    location ~ ^/api/v1/runs/[^/]+/events$ {
      proxy_pass http://workbench_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Workbench-Client-IP $http_x_workbench_client_ip;
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_read_timeout 15m;
      proxy_send_timeout 15m;
      gzip off;
      add_header X-Accel-Buffering no always;
    }

    location / {
      proxy_pass http://workbench_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_workbench_client_ip;
      proxy_set_header X-Workbench-Client-IP $http_x_workbench_client_ip;
      proxy_set_header X-Workbench-Edge-Client-IP "";
      proxy_set_header X-Workbench-Edge-Auth "";
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
  }
}
