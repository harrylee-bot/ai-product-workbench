<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需求管理 · 脑图</title>
    <link rel="stylesheet" href="/mindmap/vendor/simpleMindMap.css" />
    <style>
      :root {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2329;
        background: #f5f6f7;
        --line: #e5e6eb;
        --muted: #646a73;
        --blue: #3370ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: #f5f6f7; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .45; }
      .page { display: flex; flex-direction: column; height: 100%; }
      .topbar { height: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); background: #fff; }
      .crumbs { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--muted); font-size: 13px; }
      .crumbs a { color: #1f2329; text-decoration: none; font-weight: 650; }
      .crumbs .slash { color: #afb3b8; }
      .title-input { width: 190px; border: 0; outline: 0; background: transparent; color: #1f2329; font-size: 15px; font-weight: 650; }
      .actions { display: flex; align-items: center; gap: 6px; }
      .actions button, .zoom button { height: 32px; border: 1px solid #d9dce1; border-radius: 6px; background: #fff; color: #1f2329; padding: 0 11px; font-size: 12px; }
      .actions button:hover:not(:disabled), .zoom button:hover:not(:disabled) { background: #f2f3f5; }
      .actions .primary { color: #fff; border-color: var(--blue); background: var(--blue); }
      .actions .primary:hover:not(:disabled) { background: #2860df; }
      .actions .status-indicator { cursor: default; color: #8f959e; background: transparent; border-color: transparent; }
      .actions .status-indicator:hover { background: transparent; }
      .divider { width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
      .workspace { position: relative; flex: 1; min-height: 0; display: flex; }
      .canvas-wrap { position: relative; flex: 1; min-width: 0; background: #fff; }
      #mindmap { position: absolute; inset: 0; background-color: #fff; background-image: radial-gradient(#e7e9ed 1px, transparent 1px); background-size: 24px 24px; }
      .hint { position: absolute; left: 18px; bottom: 16px; z-index: 5; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: #8f959e; background: rgba(255,255,255,.94); font-size: 12px; pointer-events: none; }
      .zoom { position: absolute; right: 18px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.96); box-shadow: 0 4px 14px rgba(31,35,41,.08); }
      .zoom button { width: 32px; padding: 0; }
      .zoom-value { min-width: 48px; text-align: center; color: var(--muted); font-size: 12px; }
      .inspector { width: 268px; flex: 0 0 268px; padding: 18px 16px; border-left: 1px solid var(--line); background: #fff; overflow-y: auto; }
      .inspector h2 { margin: 0 0 16px; font-size: 14px; }
      .empty { color: #9aa0a6; font-size: 13px; line-height: 1.6; }
      .field { margin-bottom: 14px; }
      .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
      .field input, .field select { width: 100%; height: 34px; padding: 0 9px; border: 1px solid #d9dce1; border-radius: 6px; outline: 0; color: #1f2329; background: #fff; font-size: 13px; }
      .field input:focus, .field select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(51,112,255,.12); }
      .field .btn-row { display: flex; gap: 6px; }
      .field .btn-row button { flex: 1; height: 32px; border: 1px solid #d9dce1; border-radius: 6px; background: #fff; font-size: 12px; }
      .field .btn-row button:hover { background: #f2f3f5; }
      .danger { width: 100%; height: 34px; border: 1px solid #f2b8b5; border-radius: 6px; color: #d93025; background: #fff; font-size: 13px; }
      .danger:hover:not(:disabled) { background: #fff4f3; }
      .smm-node-text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif !important; }
      .smm-richtext-node-wrap, .smm-richtext-node-wrap p { margin: 0 !important; padding: 0 !important; }
      .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none; align-items: center; justify-content: center; }
      .modal-overlay.show { display: flex; }
      .modal { width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.16); }
      .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; }
      .modal-body { padding: 20px; }
      .modal-footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
      .modal-footer button { height: 36px; padding: 0 18px; border: 1px solid #d9dce1; border-radius: 6px; background: #fff; font-size: 13px; }
      .modal-footer button.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
      .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .theme-item { padding: 12px; border: 2px solid var(--line); border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; transition: all .15s; }
      .theme-item:hover { border-color: var(--blue); background: #f5f8ff; }
      .theme-item.active { border-color: var(--blue); background: #e8f2ff; }
      .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .layout-item { padding: 16px 12px; border: 2px solid var(--line); border-radius: 8px; text-align: center; font-size: 13px; cursor: pointer; transition: all .15s; }
      .layout-item:hover { border-color: var(--blue); background: #f5f8ff; }
      .layout-item.active { border-color: var(--blue); background: #e8f2ff; font-weight: 600; }
      @media (max-width: 800px) {
        .inspector { display: none; }
        .actions button.optional { display: none; }
        .title-input { width: 130px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="crumbs">
          <a href="/">需求管理</a><span class="slash">/</span>
          <input id="titleInput" class="title-input" aria-label="画布名称" value="需求脑图" />
        </div>
        <div class="actions">
          <button id="undoBtn" title="撤销 (Ctrl+Z)" disabled>↶</button>
          <button id="redoBtn" title="重做 (Ctrl+Y)" disabled>↷</button>
          <span class="divider"></span>
          <button id="layoutBtn" class="optional">布局</button>
          <button id="themeBtn" class="optional">主题</button>
          <button id="childBtn" class="optional" disabled>子节点</button>
          <button id="siblingBtn" class="optional" disabled>同级</button>
          <span class="divider"></span>
          <button id="searchBtn" class="optional">搜索</button>
          <button id="exportImgBtn" class="optional">导出图片</button>
          <button id="importBtn" class="optional">导入</button>
          <button id="exportBtn" class="optional">导出</button>
          <button id="saveStatus" class="status-indicator" disabled>已保存</button>
        </div>
      </header>
      <div class="workspace">
        <div class="canvas-wrap">
          <div id="mindmap"></div>
          <div class="hint">点击节点编辑 · Tab 子节点 · Enter 同级 · Delete 删除</div>
          <div class="zoom">
            <button id="zoomOut" title="缩小">−</button>
            <span id="zoomValue" class="zoom-value">100%</span>
            <button id="zoomIn" title="放大">+</button>
            <button id="fitBtn" title="适应画布">⊡</button>
          </div>
        </div>
        <aside class="inspector">
          <div id="emptyInspector" class="empty">点击节点查看详情</div>
          <div id="nodeInspector" hidden>
            <h2>节点属性</h2>
            <div class="field">
              <label for="statusInput">状态</label>
              <input id="statusInput" placeholder="留空不展示" />
            </div>
            <div class="field">
              <label for="ownerInput">负责人</label>
              <input id="ownerInput" placeholder="留空不展示" />
            </div>
            <div class="field">
              <label>节点形状</label>
              <select id="shapeInput">
                <option value="rectangle">矩形</option>
                <option value="roundedRectangle">圆角矩形</option>
                <option value="diamond">菱形</option>
                <option value="parallelogram">平行四边形</option>
                <option value="roundedParallelogram">圆角平行四边形</option>
                <option value="circle">圆形</option>
              </select>
            </div>
            <div class="field">
              <label>节点颜色</label>
              <div class="btn-row">
                <button id="bgColorBtn" title="背景颜色">背景</button>
                <button id="borderColorBtn" title="边框颜色">边框</button>
              </div>
            </div>
            <button id="deleteBtn" class="danger">删除节点</button>
          </div>
        </aside>
      </div>
    </main>

    <!-- 主题选择弹窗 -->
    <div id="themeModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">选择主题</div>
        <div class="modal-body">
          <div id="themeGrid" class="theme-grid"></div>
        </div>
        <div class="modal-footer">
          <button id="closeThemeModal">关闭</button>
        </div>
      </div>
    </div>

    <!-- 布局选择弹窗 -->
    <div id="layoutModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">选择布局</div>
        <div class="modal-body">
          <div id="layoutGrid" class="layout-grid"></div>
        </div>
        <div class="modal-footer">
          <button id="closeLayoutModal">关闭</button>
        </div>
      </div>
    </div>

    <!-- 搜索弹窗 -->
    <div id="searchModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">搜索节点</div>
        <div class="modal-body">
          <div class="field">
            <input id="searchInput" placeholder="输入关键词搜索..." />
          </div>
          <div id="searchResults" style="margin-top: 12px; font-size: 13px; color: var(--muted);"></div>
        </div>
        <div class="modal-footer">
          <button id="closeSearchModal">关闭</button>
        </div>
      </div>
    </div>

    <script src="/mindmap/vendor/simpleMindMap.umd.min.js"></script>
    <script>
      (() => {
        const STORAGE_KEY = 'apitable-mindmap-data';
        const clone = (x) => JSON.parse(JSON.stringify(x));
        const defaultData = { root: { data: { text: '需求管理平台' }, children: [{ data: { text: '核心模块', expand: true }, children: [{ data: { text: '需求池', status: '开发中', owner: '产品团队' } }, { data: { text: '看板', status: '规划中' } }, { data: { text: '脑图', status: '已上线' } }] }, { data: { text: '扩展功能', expand: true }, children: [{ data: { text: '数据分析' } }, { data: { text: '团队协作' } }] }] } };

        let stored = null;
        try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) stored = JSON.parse(raw); } catch {}
        let title = stored?.title || '需求脑图';
        let currentNode = null;
        let currentTheme = stored?.theme || 'default';
        let currentLayout = stored?.layout || 'logicalStructure';

        const themes = [
          { id: 'default', name: '默认' },
          { id: 'classic', name: '经典' },
          { id: 'minions', name: '小黄人' },
          { id: 'pinkGrape', name: '粉红葡萄' },
          { id: 'mint', name: '薄荷' },
          { id: 'gold', name: '金色' },
          { id: 'vitalityOrange', name: '活力橙' },
          { id: 'greenLeaf', name: '绿叶' },
          { id: 'dark2', name: '暗色' },
          { id: 'avocado', name: '牛油果' },
          { id: 'autumn', name: '秋天' },
          { id: 'orangeJuice', name: '橙汁' },
          { id: 'coffee', name: '咖啡' },
          { id: 'blueSky', name: '蓝天' },
          { id: 'brainImpairedPink', name: '脑残粉' },
          { id: 'red', name: '红色' },
          { id: 'rose', name: '玫瑰' },
          { id: 'seaBlueLine', name: '海蓝线' },
          { id: 'neonLamp', name: '霓虹灯' },
          { id: 'shallowSea', name: '浅海' }
        ];

        const layouts = [
          { id: 'logicalStructure', name: '逻辑结构图' },
          { id: 'mindMap', name: '思维导图' },
          { id: 'organizationStructure', name: '组织结构图' },
          { id: 'catalogOrganization', name: '目录组织图' },
          { id: 'timeline', name: '时间轴' },
          { id: 'timeline2', name: '时间轴2' },
          { id: 'fishbone', name: '鱼骨图' }
        ];

        const mindMap = new window.simpleMindMap.default({
          el: document.getElementById('mindmap'),
          data: stored?.data?.root || stored?.data || clone(defaultData.root),
          layout: currentLayout,
          theme: currentTheme,
          fit: true,
          readonly: false,
          enableFreeDrag: true,
          mousewheelAction: 'zoom'
        });
        window.__mindMap = mindMap;
        document.getElementById('titleInput').value = title;

        const getData = () => mindMap.getData(true);
        const setTextEditor = (node) => {
          if (node && mindMap.renderer?.textEdit && !mindMap.renderer.textEdit.isShowTextEdit()) {
            window.setTimeout(() => mindMap.renderer.textEdit.show({ node }), 0);
          }
        };

        const updateButtonStates = () => {
          const hasNode = !!currentNode;
          const canUndo = mindMap.renderer?.history?.length > 0;
          const canRedo = mindMap.renderer?.activeHistoryIndex < (mindMap.renderer?.history?.length || 0) - 1;

          document.getElementById('childBtn').disabled = !hasNode;
          document.getElementById('siblingBtn').disabled = !hasNode;
          document.getElementById('deleteBtn').disabled = !hasNode;
          document.getElementById('undoBtn').disabled = !canUndo;
          document.getElementById('redoBtn').disabled = !canRedo;
        };

        const selectNode = (node) => {
          currentNode = node || null;
          const empty = document.getElementById('emptyInspector');
          const panel = document.getElementById('nodeInspector');
          if (!node) {
            empty.hidden = false;
            panel.hidden = true;
            updateButtonStates();
            return;
          }
          empty.hidden = true;
          panel.hidden = false;
          document.getElementById('statusInput').value = node.getData?.('status') || node.data?.status || '';
          document.getElementById('ownerInput').value = node.getData?.('owner') || node.data?.owner || '';
          document.getElementById('shapeInput').value = node.getData?.('shape') || node.data?.shape || 'rectangle';
          updateButtonStates();
        };

        let saveTimer = null;
        const save = () => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ title, theme: currentTheme, layout: currentLayout, data: getData() }));
          const btn = document.getElementById('saveStatus');
          btn.textContent = '已保存';
          btn.style.color = '#52c41a';
          window.setTimeout(() => { btn.style.color = ''; }, 800);
        };
        const autoSave = () => {
          if (saveTimer) window.clearTimeout(saveTimer);
          const btn = document.getElementById('saveStatus');
          btn.textContent = '保存中...';
          btn.style.color = '#8f959e';
          saveTimer = window.setTimeout(save, 400);
        };

        mindMap.on('node_active', (node) => { selectNode(node); setTextEditor(node); });
        mindMap.on('node_click', (node) => { selectNode(node); });
        mindMap.on('data_change', () => { updateZoom(); autoSave(); updateButtonStates(); });
        mindMap.on('back', updateButtonStates);
        mindMap.on('forward', updateButtonStates);

        const updateZoom = () => {
          const value = mindMap.view?.scale || mindMap.renderer?.scale || 1;
          document.getElementById('zoomValue').textContent = Math.round(value * 100) + '%';
        };

        // 主题弹窗
        const themeGrid = document.getElementById('themeGrid');
        themes.forEach(theme => {
          const item = document.createElement('div');
          item.className = 'theme-item' + (theme.id === currentTheme ? ' active' : '');
          item.textContent = theme.name;
          item.onclick = () => {
            currentTheme = theme.id;
            mindMap.setTheme(theme.id);
            document.querySelectorAll('.theme-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            autoSave();
          };
          themeGrid.appendChild(item);
        });

        // 布局弹窗
        const layoutGrid = document.getElementById('layoutGrid');
        layouts.forEach(layout => {
          const item = document.createElement('div');
          item.className = 'layout-item' + (layout.id === currentLayout ? ' active' : '');
          item.textContent = layout.name;
          item.onclick = () => {
            currentLayout = layout.id;
            mindMap.setLayout(layout.id);
            document.querySelectorAll('.layout-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            autoSave();
          };
          layoutGrid.appendChild(item);
        });

        // 事件绑定
        document.getElementById('titleInput').addEventListener('input', (e) => { title = e.target.value; autoSave(); });
        document.getElementById('undoBtn').addEventListener('click', () => mindMap.execCommand('BACK'));
        document.getElementById('redoBtn').addEventListener('click', () => mindMap.execCommand('FORWARD'));
        document.getElementById('childBtn').addEventListener('click', () => { if (currentNode) mindMap.execCommand('INSERT_CHILD_NODE'); });
        document.getElementById('siblingBtn').addEventListener('click', () => { if (currentNode) mindMap.execCommand('INSERT_NODE'); });
        document.getElementById('fitBtn').addEventListener('click', () => { mindMap.view.fit(); updateZoom(); });
        document.getElementById('zoomIn').addEventListener('click', () => { mindMap.view.enlarge?.(); updateZoom(); });
        document.getElementById('zoomOut').addEventListener('click', () => { mindMap.view.narrow?.(); updateZoom(); });

        document.getElementById('themeBtn').addEventListener('click', () => {
          document.getElementById('themeModal').classList.add('show');
        });
        document.getElementById('closeThemeModal').addEventListener('click', () => {
          document.getElementById('themeModal').classList.remove('show');
        });

        document.getElementById('layoutBtn').addEventListener('click', () => {
          document.getElementById('layoutModal').classList.add('show');
        });
        document.getElementById('closeLayoutModal').addEventListener('click', () => {
          document.getElementById('layoutModal').classList.remove('show');
        });

        document.getElementById('searchBtn').addEventListener('click', () => {
          document.getElementById('searchModal').classList.add('show');
          document.getElementById('searchInput').focus();
        });
        document.getElementById('closeSearchModal').addEventListener('click', () => {
          document.getElementById('searchModal').classList.remove('show');
        });
        document.getElementById('searchInput').addEventListener('input', (e) => {
          const keyword = e.target.value.trim();
          const results = document.getElementById('searchResults');
          if (!keyword) {
            results.textContent = '请输入关键词';
            return;
          }
          const matches = mindMap.renderer?.search?.(keyword);
          if (!matches || matches.length === 0) {
            results.textContent = '未找到匹配的节点';
          } else {
            results.textContent = `找到 ${matches.length} 个匹配节点`;
          }
        });

        document.getElementById('exportImgBtn').addEventListener('click', async () => {
          try {
            const data = await mindMap.export('png', true, '需求脑图');
            const link = document.createElement('a');
            link.href = data;
            link.download = '需求脑图.png';
            link.click();
          } catch (err) {
            alert('导出失败: ' + err.message);
          }
        });

        document.getElementById('deleteBtn').addEventListener('click', () => {
          if (currentNode) {
            mindMap.execCommand('REMOVE_NODE');
            currentNode = null;
            selectNode(null);
          }
        });

        document.getElementById('statusInput').addEventListener('change', (e) => {
          if (!currentNode) return;
          currentNode.data.status = e.target.value;
          autoSave();
        });

        document.getElementById('ownerInput').addEventListener('input', (e) => {
          if (!currentNode) return;
          currentNode.data.owner = e.target.value;
          autoSave();
        });

        document.getElementById('shapeInput').addEventListener('change', (e) => {
          if (!currentNode) return;
          mindMap.execCommand('SET_NODE_SHAPE', currentNode, e.target.value);
          autoSave();
        });

        document.getElementById('bgColorBtn').addEventListener('click', () => {
          if (!currentNode) return;
          const color = prompt('输入背景颜色（如 #ff6b6b 或 rgb(255,107,107)）', currentNode.getData?.('fillColor') || '#fff');
          if (color) {
            mindMap.execCommand('SET_NODE_STYLE', currentNode, { fillColor: color });
            autoSave();
          }
        });

        document.getElementById('borderColorBtn').addEventListener('click', () => {
          if (!currentNode) return;
          const color = prompt('输入边框颜色（如 #3370ff 或 rgb(51,112,255)）', currentNode.getData?.('borderColor') || '#ccc');
          if (color) {
            mindMap.execCommand('SET_NODE_STYLE', currentNode, { borderColor: color });
            autoSave();
          }
        });

        document.getElementById('importBtn').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'application/json';
          input.onchange = () => {
            const file = input.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const value = JSON.parse(String(reader.result));
                const data = value.data || value;
                if (!data.root) throw new Error('invalid');
                mindMap.setFullData(data);
                title = value.title || '需求脑图';
                currentTheme = value.theme || 'default';
                currentLayout = value.layout || 'logicalStructure';
                document.getElementById('titleInput').value = title;
                autoSave();
              } catch {
                alert('导入文件格式不正确');
              }
            };
            reader.readAsText(file);
          };
          input.click();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify({ title, theme: currentTheme, layout: currentLayout, data: getData() }, null, 2)], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = '需求脑图.json';
          link.click();
          URL.revokeObjectURL(link.href);
        });

        updateZoom();
        updateButtonStates();
      })();
    </script>
  </body>
</html>
