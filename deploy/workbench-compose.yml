      WORKBENCH_PREVIEW_PORT: 4300
      WORKBENCH_PREVIEW_ORIGIN: ${WORKBENCH_PREVIEW_ORIGIN:?WORKBENCH_PREVIEW_ORIGIN is required and must differ from WORKBENCH_WEB_ORIGIN}
      WORKBENCH_WEB_ORIGIN: ${WORKBENCH_WEB_ORIGIN:?WORKBENCH_WEB_ORIGIN is required}
      WORKBENCH_PREVIEW_TOKEN_SECRET: ${WORKBENCH_PREVIEW_TOKEN_SECRET:?WORKBENCH_PREVIEW_TOKEN_SECRET is required}
      WORKBENCH_PREVIEW_TOKEN_MAX_TTL_SECONDS: ${WORKBENCH_PREVIEW_TOKEN_MAX_TTL_SECONDS:-3600}
      WORKBENCH_PREVIEW_MAX_HTML_BYTES: ${WORKBENCH_PREVIEW_MAX_HTML_BYTES:-52428800}
      WORKBENCH_PREVIEW_MAX_CONCURRENCY: ${WORKBENCH_PREVIEW_MAX_CONCURRENCY:-4}
      WORKBENCH_PREVIEW_SPOOL_DIR: /var/lib/workbench-preview
      WORKBENCH_S3_INTERNAL_ENDPOINT: ${WORKBENCH_S3_INTERNAL_ENDPOINT:-}
      WORKBENCH_S3_BUCKET: ${WORKBENCH_S3_BUCKET:?WORKBENCH_S3_BUCKET is required}
      WORKBENCH_S3_REGION: ${WORKBENCH_S3_REGION:-us-east-1}
      WORKBENCH_S3_INTERNAL_FORCE_PATH_STYLE: ${WORKBENCH_S3_INTERNAL_FORCE_PATH_STYLE:-false}
      WORKBENCH_PREVIEW_S3_ACCESS_KEY_ID: ${WORKBENCH_PREVIEW_S3_ACCESS_KEY_ID:?WORKBENCH_PREVIEW_S3_ACCESS_KEY_ID is required}
      WORKBENCH_PREVIEW_S3_SECRET_ACCESS_KEY: ${WORKBENCH_PREVIEW_S3_SECRET_ACCESS_KEY:?WORKBENCH_PREVIEW_S3_SECRET_ACCESS_KEY is required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - workbench-preview-spool:/var/lib/workbench-preview
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4300/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4
    networks: [workbench-internal]

  knowledge:
    image: ${WORKBENCH_KNOWLEDGE_IMAGE_REF:-workbench-quartz:local}
    build:
      context: ..
      dockerfile: apps/knowledge/Dockerfile
      target: immutable-runner
      args:
        NODE_IMAGE: ${WORKBENCH_NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${WORKBENCH_NGINX_IMAGE:-nginx:1.27.5-alpine}
        QUARTZ_REF: ${WORKBENCH_QUARTZ_REF:-v5.0.0}
        QUARTZ_COMMIT: ${WORKBENCH_QUARTZ_COMMIT:-ab346fa66a895e12d63a308e70ce330ba795822a}
        QUARTZ_BASE_URL: ${WORKBENCH_KNOWLEDGE_BASE_URL:?WORKBENCH_KNOWLEDGE_BASE_URL is required, for example aionbench.com/knowledge}
        KNOWLEDGE_WEB_URL: ${WORKBENCH_WEB_ORIGIN:?WORKBENCH_WEB_ORIGIN is required}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1770
      - /var/run:uid=101,gid=101,mode=1770
      - /tmp:uid=101,gid=101,mode=1770
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/__health]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4
    networks: [workbench-internal]

  preview-gateway:
    image: ${WORKBENCH_NGINX_IMAGE:-nginx:1.27.5-alpine}
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx, -g, daemon off;]
    depends_on:
      workbench-preview:
        condition: service_healthy
    ports:
      # Terminate the dedicated preview hostname/TLS vhost in front of this port.
      - 127.0.0.1:${WORKBENCH_PREVIEW_GATEWAY_PORT:-4190}:8080
    volumes:
      - ./workbench-preview-nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1770
      - /var/run:uid=101,gid=101,mode=1770
      - /tmp:uid=101,gid=101,mode=1770
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 4
    networks: [workbench-internal, workbench-ingress]

  gateway:
    image: ${WORKBENCH_NGINX_IMAGE:-nginx:1.27.5-alpine}
    restart: unless-stopped
    entrypoint: [nginx, -g, daemon off;]
    depends_on:
      workbench-web:
        condition: service_healthy
      workbench-api:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    ports:
      - 127.0.0.1:${WORKBENCH_GATEWAY_PORT:-4180}:8080
    volumes:
      - ./workbench-nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 4
    networks: [workbench-internal, workbench-ingress]

volumes:
  workbench-postgres-data:
  workbench-object-data:
  workbench-api-ready-object-spool:
  workbench-preview-spool:

networks:
  workbench-internal:
    name: ${WORKBENCH_INTERNAL_NETWORK_NAME:-workbench_workbench-internal}
    internal: true
  # Published loopback ports need a non-internal bridge. Masquerading stays off
  # so attaching an edge service here does not grant general Internet egress.
  workbench-ingress:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # API needs OIDC JWKS access and Worker needs DeerFlow/provider access. No
  # service ports are published on this network.
  workbench-egress:
