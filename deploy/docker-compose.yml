services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ai-product-workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_product_workbench
      POSTGRES_USER: ai_workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_workbench}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workbench -d ai_product_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.142.2}
    container_name: ai-product-workbench-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai_workbench:${POSTGRES_PASSWORD:-ai_workbench}@postgres:5432/ai_product_workbench?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-ai-product-workbench-secret-change-before-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://8.130.160.177:3000}
      FILE_UPLOAD_ROOT: /app/apps/api/storage/uploads
      KNOWLEDGE_VAULT_ROOT: /app/apps/api/storage/knowledge-vault
      RUNTIME_SKILLS_ROOT: /app/runtime-skills/obsidian-skills/skills:/root/.codex/skills
      MODEL_GATEWAY_ENCRYPTION_KEY: ${MODEL_GATEWAY_ENCRYPTION_KEY:-}
      DEFAULT_MODEL_PROVIDER_NAME: ${DEFAULT_MODEL_PROVIDER_NAME:-XXTF OpenAI}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-https://xxtf.baby/v1}
      DEFAULT_MODEL_API_KEY: ${DEFAULT_MODEL_API_KEY:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gpt-5.5}
      VIBE_REQUIREMENT_RUNTIME: ${VIBE_REQUIREMENT_RUNTIME:-local}
      VIBE_PROTOTYPE_SPEC_RUNTIME: ${VIBE_PROTOTYPE_SPEC_RUNTIME:-local}
      VIBE_PROTOTYPE_CODE_RUNTIME: ${VIBE_PROTOTYPE_CODE_RUNTIME:-local}
      VIBE_PATCH_PLAN_RUNTIME: ${VIBE_PATCH_PLAN_RUNTIME:-local}
      VIBE_QA_RUNTIME: ${VIBE_QA_RUNTIME:-local}
      VIBE_RUNTIME_FALLBACK_TO_LOCAL: ${VIBE_RUNTIME_FALLBACK_TO_LOCAL:-true}
      VIBE_RUNTIME_WORKSPACE_ROOT: ${VIBE_RUNTIME_WORKSPACE_ROOT:-/app/apps/api/storage/runtime-workspaces}
      VIBE_CODEX_COMMAND: ${VIBE_CODEX_COMMAND:-codex}
      DEERFLOW_GATEWAY_URL: ${DEERFLOW_GATEWAY_URL:-}
      DEERFLOW_GATEWAY_MODE: ${DEERFLOW_GATEWAY_MODE:-vibe}
      DEERFLOW_GATEWAY_PATH: ${DEERFLOW_GATEWAY_PATH:-/api/vibe/tasks}
      DEERFLOW_ASSISTANT_ID: ${DEERFLOW_ASSISTANT_ID:-agent}
      DEERFLOW_REQUEST_TIMEOUT_MS: ${DEERFLOW_REQUEST_TIMEOUT_MS:-180000}
    ports:
      - "4000:4000"
    volumes:
      - ../runtime-skills:/app/runtime-skills:ro
      - api-storage:/app/apps/api/storage

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://8.130.160.177:4000/api}
        NEXT_PUBLIC_KNOWLEDGE_APP_URL: ${NEXT_PUBLIC_KNOWLEDGE_APP_URL:-http://8.130.160.177:3001}
    container_name: ai-product-workbench-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://8.130.160.177:4000/api}
      NEXT_PUBLIC_KNOWLEDGE_APP_URL: ${NEXT_PUBLIC_KNOWLEDGE_APP_URL:-http://8.130.160.177:3001}
    ports:
      - "3000:3000"

  knowledge:
    build:
      context: ..
      dockerfile: apps/knowledge/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        QUARTZ_REF: ${QUARTZ_REF:-v5}
    container_name: ai-product-knowledge
    restart: unless-stopped
    environment:
      QUARTZ_BASE_URL: ${QUARTZ_BASE_URL:-8.130.160.177:3001}
      QUARTZ_CONTENT_DIR: /storage/knowledge-vault
      QUARTZ_CONCURRENCY: ${QUARTZ_CONCURRENCY:-2}
    ports:
      - "${KNOWLEDGE_APP_PORT:-3001}:3000"
    volumes:
      - api-storage:/storage

volumes:
  postgres-data:
  api-storage:
