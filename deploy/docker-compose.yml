name: ai-product-workbench

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ai-product-workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_product_workbench
      POSTGRES_USER: ai_workbench
      # 必填：deploy/server-deploy.sh 启动期 fail-fast 校验，弱默认/空值拒绝部署。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workbench -d ai_product_workbench"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: ai-product-workbench-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://ai_workbench:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ai_product_workbench?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      TRUST_PROXY: ${DOCKER_TRUST_PROXY:-loopback,linklocal,uniquelocal}
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://aionbench.com/api}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.local}
      FILE_UPLOAD_ROOT: /app/apps/api/storage/uploads
      CHAT_ATTACHMENT_MAX_FILES: ${CHAT_ATTACHMENT_MAX_FILES:-8}
      CHAT_ATTACHMENT_MAX_TOTAL_BYTES: ${CHAT_ATTACHMENT_MAX_TOTAL_BYTES:-67108864}
      FILE_RECOVERY_ENABLED: ${FILE_RECOVERY_ENABLED:-true}
      FILE_RECOVERY_MAX_QUEUED_CONVERSIONS: ${FILE_RECOVERY_MAX_QUEUED_CONVERSIONS:-20}
      KNOWLEDGE_VAULT_ROOT: ${DOCKER_KNOWLEDGE_VAULT_ROOT:-/app/apps/api/storage/knowledge-vault}
      KNOWLEDGE_DAILY_SYNC_ENABLED: ${KNOWLEDGE_DAILY_SYNC_ENABLED:-true}
      KNOWLEDGE_DAILY_SYNC_ON_STARTUP: ${KNOWLEDGE_DAILY_SYNC_ON_STARTUP:-true}
      KNOWLEDGE_DAILY_SYNC_INTERVAL_MS: ${KNOWLEDGE_DAILY_SYNC_INTERVAL_MS:-86400000}
      MODEL_GATEWAY_ENCRYPTION_KEY: ${MODEL_GATEWAY_ENCRYPTION_KEY:?MODEL_GATEWAY_ENCRYPTION_KEY must be set}
      MODEL_GATEWAY_KEEP_ONLY_DEFAULT_PROVIDER: ${MODEL_GATEWAY_KEEP_ONLY_DEFAULT_PROVIDER:-true}
      MODEL_GATEWAY_HIDE_DISABLED_PROVIDERS: ${MODEL_GATEWAY_HIDE_DISABLED_PROVIDERS:-true}
      DEFAULT_MODEL_PROVIDER_NAME: ${DEFAULT_MODEL_PROVIDER_NAME:-datatoken}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-https://datatoken.shop}
      DEFAULT_MODEL_API_KEY: ${DEFAULT_MODEL_API_KEY:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-}
      DEFAULT_MODEL_FAST_NAME: ${DEFAULT_MODEL_FAST_NAME:-}
      DEFAULT_MODEL_REASONING_NAME: ${DEFAULT_MODEL_REASONING_NAME:-}
      DEFAULT_MODEL_LONG_CONTEXT_NAME: ${DEFAULT_MODEL_LONG_CONTEXT_NAME:-}
      DEFAULT_MODEL_CODE_NAME: ${DEFAULT_MODEL_CODE_NAME:-}
      DEFAULT_MODEL_TASK_INTENT_DETECTION_NAME: ${DEFAULT_MODEL_TASK_INTENT_DETECTION_NAME:-}
      DEFAULT_MODEL_TASK_KNOWLEDGE_CLASSIFICATION_NAME: ${DEFAULT_MODEL_TASK_KNOWLEDGE_CLASSIFICATION_NAME:-}
      DEFAULT_MODEL_TASK_REQUIREMENT_ANALYSIS_NAME: ${DEFAULT_MODEL_TASK_REQUIREMENT_ANALYSIS_NAME:-}
      DEFAULT_MODEL_TASK_CONVERSATION_PLANNING_NAME: ${DEFAULT_MODEL_TASK_CONVERSATION_PLANNING_NAME:-}
      DEFAULT_MODEL_TASK_CONVERSATION_DESIGN_NAME: ${DEFAULT_MODEL_TASK_CONVERSATION_DESIGN_NAME:-}
      DEFAULT_MODEL_TASK_PRD_GENERATION_NAME: ${DEFAULT_MODEL_TASK_PRD_GENERATION_NAME:-}
      DEFAULT_MODEL_TASK_PROTOTYPE_DESIGN_NAME: ${DEFAULT_MODEL_TASK_PROTOTYPE_DESIGN_NAME:-}
      DEFAULT_MODEL_TASK_PROTOTYPE_CODE_GENERATION_NAME: ${DEFAULT_MODEL_TASK_PROTOTYPE_CODE_GENERATION_NAME:-}
      DEFAULT_MODEL_TASK_QA_CHECK_NAME: ${DEFAULT_MODEL_TASK_QA_CHECK_NAME:-}
      DEFAULT_MODEL_TASK_KNOWLEDGE_EXTRACTION_NAME: ${DEFAULT_MODEL_TASK_KNOWLEDGE_EXTRACTION_NAME:-}
      DEFAULT_MODEL_TASK_GENERAL_CHAT_NAME: ${DEFAULT_MODEL_TASK_GENERAL_CHAT_NAME:-}
      DEERFLOW_ENABLED: ${DEERFLOW_ENABLED:-false}
      DEERFLOW_LANGGRAPH_URL: ${DEERFLOW_LANGGRAPH_URL:-http://host.docker.internal:8001/api}
      DEERFLOW_GATEWAY_URL: ${DEERFLOW_GATEWAY_URL:-http://host.docker.internal:8001}
      DEERFLOW_READINESS_REQUIRED: ${DEERFLOW_READINESS_REQUIRED:-false}
      DEERFLOW_HEALTH_URL: ${DEERFLOW_HEALTH_URL:-}
      DEERFLOW_HEALTH_TIMEOUT_MS: ${DEERFLOW_HEALTH_TIMEOUT_MS:-2000}
      DEERFLOW_ASSISTANT_ID: ${DEERFLOW_ASSISTANT_ID:-lead_agent}
      DEERFLOW_AGENT_NAME: ${DEERFLOW_AGENT_NAME:-}
      DEERFLOW_MODEL_NAME: ${DEERFLOW_MODEL_NAME:-}
      DEERFLOW_MODEL_DISPLAY_NAME: ${DEERFLOW_MODEL_DISPLAY_NAME:-}
      DEERFLOW_MODEL_PROVIDER: ${DEERFLOW_MODEL_PROVIDER:-}
      DEERFLOW_STREAM_MODE: ${DEERFLOW_STREAM_MODE:-messages,values}
      DEERFLOW_INTERNAL_AUTH_TOKEN: ${DEERFLOW_INTERNAL_AUTH_TOKEN:-}
      DEERFLOW_PLAN_MODE: ${DEERFLOW_PLAN_MODE:-true}
      DEERFLOW_THINKING_ENABLED: ${DEERFLOW_THINKING_ENABLED:-true}
      DEERFLOW_SUBAGENT_ENABLED: ${DEERFLOW_SUBAGENT_ENABLED:-true}
      DEERFLOW_MAX_CONCURRENT_SUBAGENTS: ${DEERFLOW_MAX_CONCURRENT_SUBAGENTS:-3}
      DEERFLOW_TIMEOUT_MS: ${DEERFLOW_TIMEOUT_MS:-600000}
      AICHAT_MODEL_IDLE_TIMEOUT_MS: ${AICHAT_MODEL_IDLE_TIMEOUT_MS:-600000}
      AICHAT_ARTIFACT_REPAIR_ATTEMPTS: ${AICHAT_ARTIFACT_REPAIR_ATTEMPTS:-2}
      AGENT_RUN_LEASE_MS: ${AGENT_RUN_LEASE_MS:-45000}
      AGENT_RUN_HEARTBEAT_MS: ${AGENT_RUN_HEARTBEAT_MS:-15000}
      DEERFLOW_REPLACE_THREAD_ON_ACTIVE_RUN: ${DEERFLOW_REPLACE_THREAD_ON_ACTIVE_RUN:-false}
      DEERFLOW_UPLOADS_ENABLED: ${DEERFLOW_UPLOADS_ENABLED:-true}
      DEERFLOW_ARTIFACT_MAX_INLINE_BYTES: ${DEERFLOW_ARTIFACT_MAX_INLINE_BYTES:-2000000}
      EXTERNAL_RESEARCH_ENABLED: ${EXTERNAL_RESEARCH_ENABLED:-false}
      EXTERNAL_RESEARCH_TIMEOUT_MS: ${EXTERNAL_RESEARCH_TIMEOUT_MS:-10000}
      EXTERNAL_RESEARCH_CACHE_TTL_MS: ${EXTERNAL_RESEARCH_CACHE_TTL_MS:-21600000}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - api-storage:/app/apps/api/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready',{headers:{'x-forwarded-proto':'https'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://aionbench.com/api}
        NEXT_PUBLIC_KNOWLEDGE_APP_URL: ${NEXT_PUBLIC_KNOWLEDGE_APP_URL:-https://aionbench.com/knowledge}
    container_name: ai-product-workbench-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://aionbench.com/api}
      NEXT_PUBLIC_KNOWLEDGE_APP_URL: ${NEXT_PUBLIC_KNOWLEDGE_APP_URL:-https://aionbench.com/knowledge}
    ports:
      - "3000:3000"

  knowledge:
    build:
      context: ..
      dockerfile: apps/knowledge/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        QUARTZ_REF: ${QUARTZ_REF:-v5.0.0}
        QUARTZ_COMMIT: ${QUARTZ_COMMIT:-ab346fa66a895e12d63a308e70ce330ba795822a}
    container_name: ai-product-knowledge
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      QUARTZ_BASE_URL: ${QUARTZ_BASE_URL:-localhost:3001}
      QUARTZ_CONTENT_DIR: /storage/knowledge-vault
      QUARTZ_CONCURRENCY: ${QUARTZ_CONCURRENCY:-2}
      QUARTZ_WATCH_ENABLED: ${QUARTZ_WATCH_ENABLED:-true}
      QUARTZ_WATCH_INTERVAL_SECONDS: ${QUARTZ_WATCH_INTERVAL_SECONDS:-30}
      KNOWLEDGE_WEB_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      QUARTZ_OUTPUT_DIR: /usr/share/nginx/html
    ports:
      - "127.0.0.1:${KNOWLEDGE_APP_PORT:-3001}:3000"
    volumes:
      - api-storage:/storage

volumes:
  postgres-data:
    name: ai-product-workbench-postgres
    external: true
  api-storage:
    name: ai-product-workbench-storage
    external: true

networks:
  default:
    name: ai-product-workbench
    external: true
