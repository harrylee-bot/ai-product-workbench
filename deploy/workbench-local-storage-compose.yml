# Optional gateway-only overlay for self-hosted object storage. Merge after the
# normal deployment overlays; it does not recreate storage or provision users.
# Pair with the local-object-storage profile and the endpoint/credential settings
# documented in ../README.md and workbench.env.example.
services:
  gateway:
    entrypoint: [/bin/sh, /etc/workbench/workbench-local-storage-nginx.sh]
    environment:
      WORKBENCH_S3_BUCKET: ${WORKBENCH_S3_BUCKET:?WORKBENCH_S3_BUCKET is required}
    depends_on:
      object-storage:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${WORKBENCH_APP_DIR:?WORKBENCH_APP_DIR is required}/deploy/workbench-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKBENCH_APP_DIR:?WORKBENCH_APP_DIR is required}/deploy/workbench-local-storage-nginx.conf.template
        target: /etc/workbench/workbench-local-storage-nginx.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKBENCH_APP_DIR:?WORKBENCH_APP_DIR is required}/deploy/workbench-local-storage-nginx.sh
        target: /etc/workbench/workbench-local-storage-nginx.sh
        read_only: true
        bind:
          create_host_path: false
