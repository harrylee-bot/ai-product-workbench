events {}

http {
  server_tokens off;
  map $http_x_forwarded_proto $workbench_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }

  upstream workbench_preview {
    server workbench-preview:4300;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 1k;

    location = /healthz {
      access_log off;
      proxy_pass http://workbench_preview;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Capability tokens are carried in the path and must never enter access logs.
    location /preview/ {
      access_log off;
      proxy_pass http://workbench_preview;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_buffering on;
      proxy_hide_header Set-Cookie;
    }

    location / {
      access_log off;
      add_header Content-Type text/plain;
      return 404 "not found\n";
    }
  }
}
