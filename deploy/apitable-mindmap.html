<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求脑图 - 需求管理</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#161719;color:#eef0f2;font:14px system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #34363b;background:#202124}a{color:#fff;text-decoration:none;font-weight:650}.crumb{color:#9b91ff}.actions{display:flex;gap:8px}button{border:1px solid #41434a;border-radius:6px;background:#292b2f;color:#e5e7eb;padding:8px 11px;cursor:pointer}button:hover{background:#373941}.primary{background:#6658e8;border-color:#786cf2}.stage{height:calc(100vh - 64px);position:relative;overflow:hidden;background-image:radial-gradient(#42454c 1px,transparent 1px);background-size:22px 22px}.node{position:absolute;min-width:150px;padding:13px 16px;border:1px solid #4f8cff;border-radius:8px;background:#202b43;box-shadow:0 8px 24px #0006;cursor:grab}.node.root{border-color:#9387ff;background:#38326d}.node b{display:block;font-size:14px;margin-bottom:6px}.node small{color:#aeb6c6}.line{position:absolute;height:2px;background:#566070;transform-origin:0 0}.panel{position:absolute;right:18px;top:18px;width:230px;padding:16px;border:1px solid #3b3d43;border-radius:8px;background:#202124ee}.panel h2{margin:6px 0 14px;font-size:17px}.panel p{color:#aeb1b8;font-size:12px;line-height:1.6}.panel input{width:100%;padding:8px;background:#17181a;border:1px solid #45474d;color:#fff;border-radius:5px}
</style></head><body><header><div><a href="/">需求管理</a><span style="color:#777;margin:0 10px">/</span><span class="crumb">需求脑图</span></div><div class="actions"><button onclick="add()">+ 新增需求</button><button onclick="reset()">重置</button><button class="primary" onclick="save()">保存</button></div></header><main id="stage" class="stage"></main><aside id="panel" class="panel" hidden><div style="color:#9b91ff;font-size:11px">需求节点</div><h2 id="selTitle"></h2><input id="editTitle" aria-label="需求名称"><p>拖动节点调整结构。脑图暂为需求池的同域视图，保存到本机浏览器。</p></aside><script>
const seed=[['需求管理平台',80,280,'root'],['需求收集',360,70],['评审与排期',360,280],['研发与发版',360,490],['表单提交',670,20],['外部需求导入',670,130],['优先级确认',670,280],['日历发版视图',670,420],['上线通知',670,560]];const links=[[0,1],[0,2],[0,3],[1,4],[1,5],[2,6],[3,7],[3,8]];let data=JSON.parse(localStorage.getItem('apitable-mindmap')||'null')||seed.map(x=>({...x}));let selected=null;const stage=document.querySelector('#stage');function render(){stage.querySelectorAll('.node,.line').forEach(x=>x.remove());data.forEach((n,i)=>{let e=document.createElement('div');e.className='node '+(n[3]||'');e.style.left=n[1]+'px';e.style.top=n[2]+'px';e.innerHTML='<b>'+n[0]+'</b><small>规划中 · 待分配</small>';e.onmousedown=ev=>drag(ev,i);e.onclick=ev=>{ev.stopPropagation();select(i)};stage.append(e)});links.forEach(([a,b])=>{if(!data[a]||!data[b])return;let l=document.createElement('i');l.className='line';let x=data[a][1]+150,y=data[a][2]+28,dx=data[b][1]-x,dy=data[b][2]+28-y;l.style.left=x+'px';l.style.top=y+'px';l.style.width=Math.hypot(dx,dy)+'px';l.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';stage.prepend(l)})}function select(i){selected=i;panel.hidden=false;selTitle.textContent=data[i][0];editTitle.value=data[i][0];editTitle.onchange=()=>{data[i][0]=editTitle.value;render();select(i)}}function drag(ev,i){if(ev.target.tagName==='INPUT')return;let sx=ev.clientX,sy=ev.clientY,ox=data[i][1],oy=data[i][2];function move(e){data[i][1]=Math.max(10,ox+e.clientX-sx);data[i][2]=Math.max(10,oy+e.clientY-sy);render()}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)}function add(){data.push(['新需求',360,240]);render();select(data.length-1)}function save(){localStorage.setItem('apitable-mindmap',JSON.stringify(data));alert('已保存到当前浏览器')}function reset(){localStorage.removeItem('apitable-mindmap');data=seed.map(x=>({...x}));render();panel.hidden=true}stage.onclick=()=>panel.hidden=true;render();
</script></body></html>
