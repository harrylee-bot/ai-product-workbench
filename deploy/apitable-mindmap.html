<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求脑图</title>
<style>
:root{color-scheme:dark;--bg:#161719;--panel:#202124;--line:#3b3e46;--text:#eef0f2;--muted:#aeb5c2;--accent:#7467f6;--blue:#4f8cff;--danger:#ef6a6a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Microsoft YaHei",sans-serif}button{border:1px solid #41444c;border-radius:6px;background:#292b2f;color:#e8eaf0;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px}button:hover{background:#363941}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#6658e8;border-color:#7c70f2}.danger{color:#ff9b9b}.active{background:#4c438e;border-color:#978cff;color:#fff}.appbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(32,33,36,.98);position:relative;z-index:5}.brand{display:flex;align-items:center;gap:10px}.brand a{color:#fff;text-decoration:none;font-weight:700}.crumb{color:#8f91a0}.title{border:0;background:transparent;color:#cfc9ff;font-weight:650;font-size:15px;width:170px;outline:0;padding:4px}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.divider{height:22px;width:1px;background:#3a3c42;margin:0 3px}.canvas{height:calc(100% - 64px);position:relative;overflow:hidden;touch-action:none;background-color:#151618;background-image:radial-gradient(#41444a 1px,transparent 1px);background-size:24px 24px;cursor:default}.canvas.connecting{cursor:crosshair}.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#6d7483;stroke-width:2}.edge.active{stroke:#9c91ff;stroke-width:3}.nodes{position:absolute;left:0;top:0}.node{position:absolute;width:190px;min-height:82px;padding:12px 14px;border:1px solid var(--blue);border-radius:9px;background:#202b43;box-shadow:0 8px 24px #0007;user-select:none}.node.root{border-color:#9488ff;background:#38326d}.node.selected{outline:2px solid #a59bff;outline-offset:2px}.node.collapsed{border-style:dashed}.node-title,.node-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-title{font-weight:700;font-size:15px;cursor:text;margin-bottom:8px}.node-meta{color:#b7bfce;font-size:12px;cursor:text}.node-meta:empty{display:none}.node-title input,.node-meta input{width:100%;padding:3px 5px;border:1px solid #a095ff;border-radius:4px;background:#151618;color:#fff;font:inherit;outline:0}.node-actions{position:absolute;right:7px;top:7px;display:none;gap:3px}.node:hover .node-actions,.node.selected .node-actions{display:flex}.node-actions button{padding:2px 5px;border:0;background:rgba(0,0,0,.2);font-size:11px}.hint{position:absolute;left:18px;bottom:16px;padding:9px 12px;border:1px solid #353840;border-radius:6px;background:#202124dd;color:#9fa5b0;font-size:12px;pointer-events:none}.zoom{position:absolute;right:18px;bottom:16px;display:flex;align-items:center;gap:5px;padding:5px;border:1px solid #363940;border-radius:7px;background:#202124e8}.zoom button{width:28px;height:28px;justify-content:center;padding:0}.zoom output{width:46px;text-align:center;color:#d8dbe2;font-size:12px}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:10;padding:9px 14px;border:1px solid #5e55bd;border-radius:7px;background:#29255a;color:#fff;box-shadow:0 8px 20px #0006;opacity:0;pointer-events:none;transition:opacity .18s}.toast.show{opacity:1}.file-input{display:none}@media(max-width:900px){.appbar{height:auto;min-height:64px;padding:10px;align-items:flex-start;gap:8px}.toolbar{justify-content:flex-end}.title{width:120px}.canvas{height:calc(100% - 82px)}}
.node-resize{position:absolute;right:3px;bottom:3px;width:15px;height:15px;cursor:nwse-resize;border-right:2px solid #9c91ff;border-bottom:2px solid #9c91ff;border-radius:0 0 3px 0;opacity:.8}.node-resize:hover{opacity:1}
</style>
</head>
<body>
<header class="appbar"><div class="brand"><a href="/">需求管理</a><span class="crumb">/ 需求脑图</span><input class="title" id="mapTitle" value="需求脑图" aria-label="脑图名称"></div><nav class="toolbar" aria-label="脑图工具"><button id="addChild">＋ 子需求</button><button id="addRoot">＋ 根节点</button><button id="connect">⌘ 连线</button><button id="delete" class="danger">⌫ 删除</button><span class="divider"></span><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="save" class="primary">保存</button><button id="import">导入</button><button id="export">导出</button><button id="reset">重置</button><input id="file" class="file-input" type="file" accept="application/json"></nav></header>
<main id="canvas" class="canvas"><div id="world" class="world"><svg id="edges" class="edges" width="1" height="1"></svg><div id="nodes" class="nodes"></div></div><div class="hint">点击标题或状态直接编辑 · 拖动卡片移动 · 滚轮缩放 · 空白处拖动画布 · Delete 删除 · Tab 新增子需求</div><div class="zoom"><button id="zoomOut">−</button><output id="zoomLabel">100%</output><button id="zoomIn">＋</button><button id="fit">适配</button></div><div id="toast" class="toast" role="status"></div></main>
<script>
const initial=[{id:'root',title:'需求管理平台',status:'规划中',owner:'产品团队',x:80,y:280,parent:null,collapsed:false},{id:'intake',title:'需求收集',status:'进行中',owner:'产品经理',x:360,y:70,parent:'root',collapsed:false},{id:'review',title:'评审与排期',status:'进行中',owner:'项目负责人',x:360,y:280,parent:'root',collapsed:false},{id:'release',title:'研发与发版',status:'规划中',owner:'研发团队',x:360,y:490,parent:'root',collapsed:false},{id:'form',title:'表单提交',status:'已上线',owner:'全员',x:670,y:20,parent:'intake',collapsed:false},{id:'import',title:'外部需求导入',status:'规划中',owner:'产品经理',x:670,y:130,parent:'intake',collapsed:false},{id:'priority',title:'优先级确认',status:'进行中',owner:'项目负责人',x:670,y:280,parent:'review',collapsed:false},{id:'calendar',title:'日历发版视图',status:'已上线',owner:'项目负责人',x:670,y:420,parent:'release',collapsed:false},{id:'notify',title:'上线通知',status:'规划中',owner:'运营',x:670,y:560,parent:'release',collapsed:false}];
const storeKey='apitable-mindmap-v2';let state=load()||{title:'需求脑图',nodes:initial.map(n=>({...n})),selected:null,zoom:1,panX:0,panY:0};let history=[],future=[],connectFrom=null,dragInfo=null,resizeInfo=null,panInfo=null;const canvas=document.querySelector('#canvas'),world=document.querySelector('#world'),nodesEl=document.querySelector('#nodes'),edgesEl=document.querySelector('#edges'),toastEl=document.querySelector('#toast');
function load(){try{return JSON.parse(localStorage.getItem(storeKey))}catch{return null}}function snapshot(){return JSON.stringify({title:state.title,nodes:state.nodes,selected:state.selected,zoom:state.zoom,panX:state.panX,panY:state.panY})}function restore(s){state=JSON.parse(s)}function commit(mutator){history.push(snapshot());future=[];mutator();render()}function persist(){localStorage.setItem(storeKey,snapshot());notify('已保存')}function notify(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toastEl.classList.remove('show'),1500)}function node(id){return state.nodes.find(n=>n.id===id)}function children(id){return state.nodes.filter(n=>n.parent===id)}function visible(n){let p=n.parent;while(p){const q=node(p);if(q&&q.collapsed)return false;p=q?.parent}return true}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function metaText(n){return [n.status,n.owner].map(v=>String(v||'').trim()).filter(Boolean).join(' · ')}
function render(){document.querySelector('#mapTitle').value=state.title;world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;const vis=state.nodes.filter(visible);const maxX=Math.max(1400,...state.nodes.map(n=>n.x+(n.w||190)+30)),maxY=Math.max(900,...state.nodes.map(n=>n.y+(n.h||82)+50));edgesEl.setAttribute('width',maxX);edgesEl.setAttribute('height',maxY);edgesEl.innerHTML='';vis.forEach(n=>{if(n.parent&&visible(node(n.parent))){const p=node(n.parent),path=document.createElementNS('http://www.w3.org/2000/svg','path');path.classList.add('edge');if(state.selected===n.id||state.selected===p.id)path.classList.add('active');const x1=p.x+(p.w||190),y1=p.y+(p.h||82)/2,x2=n.x,y2=n.y+(n.h||82)/2,c1=x1+(x2-x1)*.45,c2=x1+(x2-x1)*.55;path.setAttribute('d',`M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2}`);edgesEl.append(path)}});nodesEl.innerHTML='';vis.forEach(n=>{const e=document.createElement('article');e.className=`node ${n.parent?'':'root'} ${state.selected===n.id?'selected':''} ${n.collapsed?'collapsed':''}`;e.style.left=n.x+'px';e.style.top=n.y+'px';e.style.width=(n.w||190)+'px';if(n.h)e.style.height=n.h+'px';e.dataset.id=n.id;e.innerHTML=`<div class="node-actions"><button data-action="collapse" title="折叠/展开">${n.collapsed?'▸':'▾'}</button><button data-action="add" title="新增子需求">＋</button></div><b class="node-title">${esc(n.title)}</b><small class="node-meta">${esc(metaText(n))}</small><span class="node-resize" title="拖动调整大小" aria-label="拖动调整大小"></span>`;e.addEventListener('pointerdown',onNodeDown);e.querySelector('.node-title').addEventListener('click',ev=>{ev.stopPropagation();editField(n.id,'title')});e.querySelector('.node-meta').addEventListener('click',ev=>{ev.stopPropagation();editField(n.id,'meta')});e.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();const a=b.dataset.action;if(a==='add')addChild(n.id);else toggleCollapse(n.id)}));e.querySelector('.node-resize').addEventListener('pointerdown',onResizeDown);nodesEl.append(e)});document.querySelector('#zoomLabel').textContent=Math.round(state.zoom*100)+'%';document.querySelector('#undo').disabled=!history.length;document.querySelector('#redo').disabled=!future.length;document.querySelector('#delete').disabled=!state.selected||state.selected==='root'}
function editField(id,field){const n=node(id),e=document.querySelector(`[data-id="${id}"]`),target=e.querySelector(field==='title'?'.node-title':'.node-meta');if(!target||target.querySelector('input'))return;const input=document.createElement('input');input.value=field==='title'?n.title:metaText(n);target.replaceChildren(input);input.focus();input.select();const done=()=>{const val=input.value.trim();if(field==='title'){if(val)n.title=val}else{const p=val?val.split('·').map(x=>x.trim()):[];n.status=p[0]||'';n.owner=p.slice(1).join(' · ')||''};render()};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done()}if(e.key==='Escape'){render()}};input.onblur=done;input.onclick=e=>e.stopPropagation()}
function addChild(parentId){commit(()=>{const id='n-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),p=node(parentId);state.nodes.push({id,title:'新需求',status:'规划中',owner:'',x:(p?.x||200)+300,y:(p?.y||200)+Math.min(children(parentId).length*110,440),parent:parentId,collapsed:false});state.selected=id});setTimeout(()=>editField(state.selected,'title'),0)}function addRoot(){commit(()=>{const id='n-'+Date.now().toString(36),count=state.nodes.filter(n=>!n.parent).length;state.nodes.push({id,title:'新根节点',status:'规划中',owner:'',x:100,y:100+count*130,parent:null,collapsed:false});state.selected=id});setTimeout(()=>editField(state.selected,'title'),0)}function removeSelected(){if(!state.selected||state.selected==='root')return;commit(()=>{const doomed=new Set([state.selected]);let changed=true;while(changed){changed=false;state.nodes.forEach(n=>{if(n.parent&&doomed.has(n.parent)&&!doomed.has(n.id)){doomed.add(n.id);changed=true}})}state.nodes=state.nodes.filter(n=>!doomed.has(n.id));state.selected=null});notify('节点已删除')}function toggleCollapse(id){commit(()=>{const n=node(id);if(n)n.collapsed=!n.collapsed})}
function connect(){connectFrom=null;canvas.classList.toggle('connecting');document.querySelector('#connect').classList.toggle('active');notify(canvas.classList.contains('connecting')?'先点击父节点，再点击子节点':'已退出连线')}function onNodeDown(ev){const e=ev.currentTarget,id=e.dataset.id;state.selected=id;if(canvas.classList.contains('connecting')){if(!connectFrom){connectFrom=id;notify('已选择父节点，请点击子节点')}else if(connectFrom!==id){commit(()=>{const target=node(id);if(target)target.parent=connectFrom});connectFrom=null;canvas.classList.remove('connecting');document.querySelector('#connect').classList.remove('active')}render();return}if(ev.target.closest('input,.node-actions,.node-title,.node-meta,.node-resize'))return;ev.preventDefault();const n=node(id);dragInfo={id,sx:ev.clientX,sy:ev.clientY,ox:n.x,oy:n.y,before:snapshot(),e};e.setPointerCapture?.(ev.pointerId);e.addEventListener('pointermove',onNodeMove);e.addEventListener('pointerup',onNodeUp,{once:true})}function onNodeMove(ev){if(!dragInfo)return;const n=node(dragInfo.id);n.x=Math.max(0,dragInfo.ox+(ev.clientX-dragInfo.sx)/state.zoom);n.y=Math.max(0,dragInfo.oy+(ev.clientY-dragInfo.sy)/state.zoom);dragInfo.e.style.left=n.x+'px';dragInfo.e.style.top=n.y+'px'}function onNodeUp(){if(dragInfo){history.push(dragInfo.before);future=[];dragInfo=null;render()}}function onResizeDown(ev){ev.stopPropagation();ev.preventDefault();const e=ev.currentTarget.closest('.node'),id=e.dataset.id,n=node(id);resizeInfo={id,sx:ev.clientX,sy:ev.clientY,ow:e.offsetWidth,oh:e.offsetHeight,before:snapshot(),e};state.selected=id;e.classList.add('selected');e.setPointerCapture?.(ev.pointerId);e.addEventListener('pointermove',onResizeMove);e.addEventListener('pointerup',onResizeUp,{once:true})}function onResizeMove(ev){if(!resizeInfo)return;const n=node(resizeInfo.id);n.w=Math.max(150,Math.round(resizeInfo.ow+(ev.clientX-resizeInfo.sx)/state.zoom));n.h=Math.max(70,Math.round(resizeInfo.oh+(ev.clientY-resizeInfo.sy)/state.zoom));resizeInfo.e.style.width=n.w+'px';resizeInfo.e.style.height=n.h+'px'}function onResizeUp(){if(resizeInfo){history.push(resizeInfo.before);future=[];resizeInfo=null;render()}}
canvas.addEventListener('pointerdown',ev=>{if(ev.target!==canvas&&!ev.target.classList.contains('world'))return;panInfo={sx:ev.clientX,sy:ev.clientY,px:state.panX,py:state.panY};canvas.setPointerCapture?.(ev.pointerId)});canvas.addEventListener('pointermove',ev=>{if(!panInfo)return;state.panX=panInfo.px+ev.clientX-panInfo.sx;state.panY=panInfo.py+ev.clientY-panInfo.sy;render()});canvas.addEventListener('pointerup',()=>{if(panInfo){history.push(snapshot());future=[];panInfo=null;render()}});canvas.addEventListener('wheel',ev=>{ev.preventDefault();const before=state.zoom;state.zoom=Math.min(1.8,Math.max(.35,before*(ev.deltaY<0?1.1:.9)));render()},{passive:false});
document.querySelector('#addChild').onclick=()=>addChild(state.selected||'root');document.querySelector('#addRoot').onclick=addRoot;document.querySelector('#delete').onclick=removeSelected;document.querySelector('#connect').onclick=connect;document.querySelector('#save').onclick=persist;document.querySelector('#mapTitle').onchange=e=>{state.title=e.target.value.trim()||'需求脑图';persist()};document.querySelector('#undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop());render()}};document.querySelector('#redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop());render()}};document.querySelector('#reset').onclick=()=>{if(confirm('确定重置脑图吗？')){history.push(snapshot());future=[];state={title:'需求脑图',nodes:initial.map(n=>({...n})),selected:null,zoom:1,panX:0,panY:0};localStorage.removeItem(storeKey);render();notify('已重置')}};document.querySelector('#zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom*1.15);render()};document.querySelector('#zoomOut').onclick=()=>{state.zoom=Math.max(.35,state.zoom/1.15);render()};document.querySelector('#fit').onclick=()=>{state.zoom=1;state.panX=0;state.panY=0;render()};document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({title:state.title,nodes:state.nodes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='需求脑图.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.nodes))throw Error();commit(()=>{state.title=d.title||'需求脑图';state.nodes=d.nodes;state.selected=null});notify('导入成功')}catch{notify('导入文件格式不正确')}};r.readAsText(f)};document.addEventListener('keydown',ev=>{if(ev.target.matches('input'))return;if(ev.key==='Delete'||ev.key==='Backspace')removeSelected();if(ev.key==='Tab'){ev.preventDefault();addChild(state.selected||'root')}if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();document.querySelector('#undo').click()}if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='y'){ev.preventDefault();document.querySelector('#redo').click()}});render();
</script>
</body>
</html>
