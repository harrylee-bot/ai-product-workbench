services:
  oidc-init:
    image: ${WORKBENCH_DEX_IMAGE:-ghcr.io/dexidp/dex:v2.42.0}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 1001:1001 /var/dex"]
    restart: "no"
    volumes:
      - workbench-dex-data:/var/dex
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none

  oidc:
    image: ${WORKBENCH_DEX_IMAGE:-ghcr.io/dexidp/dex:v2.42.0}
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    depends_on:
      oidc-init:
        condition: service_completed_successfully
    volumes:
      - ./workbench-dex-config.yaml:/etc/dex/config.yaml:ro
      - workbench-dex-data:/var/dex
    ports:
      - 127.0.0.1:${WORKBENCH_DEX_PORT:-5556}:5556
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5556/healthz]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.25
    networks: [workbench-internal, workbench-ingress]

  clamav:
    image: ${WORKBENCH_CLAMAV_IMAGE:-clamav/clamav:1.4.5_base@sha256:d54ef59d5d07ff243c669789f51e0c3d9dfa9945f62b515be84febe8e1db0dbf}
    restart: unless-stopped
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_MaxQueue: "8"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_StreamMaxLength: 50M
      CLAMD_STARTUP_TIMEOUT: "300"
      FRESHCLAM_CHECKS: "4"
      FRESHCLAM_CONF_OnUpdateExecute: workbench-clamav-notify
    volumes:
      - workbench-clamav-data:/var/lib/clamav
      - ./workbench-clamav-notify.sh:/usr/local/bin/workbench-clamav-notify:ro
    healthcheck:
      test: [CMD-SHELL, "clamdscan --ping=1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
    pids_limit: 256
    mem_limit: 2048m
    cpus: 0.75
    networks: [workbench-internal, workbench-egress]

  object-storage:
    mem_limit: 512m
    cpus: 0.5

  object-storage-init:
    depends_on:
      object-storage:
        condition: service_healthy

  docling:
    mem_limit: 2048m
    cpus: 1.5

  workbench-api:
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway

  workbench-web:
    depends_on:
      migrate:
        condition: service_completed_successfully
      workbench-api:
        condition: service_healthy
      oidc:
        condition: service_healthy
    extra_hosts:
      - ${WORKBENCH_IDENTITY_HOSTNAME:?WORKBENCH_IDENTITY_HOSTNAME is required}:host-gateway

  workbench-worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
    extra_hosts:
      - host.docker.internal:host-gateway

  workbench-file-worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      docling:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully

  workbench-import-worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully

  workbench-export-worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully

  workbench-preview:
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully

volumes:
  workbench-dex-data:
  workbench-clamav-data:
