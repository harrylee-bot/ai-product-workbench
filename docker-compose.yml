services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-product-workbench-postgres
    environment:
      POSTGRES_DB: ai_product_workbench
      POSTGRES_USER: ai_workbench
      POSTGRES_PASSWORD: ai_workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workbench -d ai_product_workbench"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
