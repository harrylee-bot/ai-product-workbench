      name: artifactId
      in: path
    ArtifactVersionId:
      schema:
        $ref: "#/components/schemas/ArtifactVersionId"
      required: true
      name: artifactVersionId
      in: path
    AssetId:
      schema:
        $ref: "#/components/schemas/AssetId"
      required: true
      name: assetId
      in: path
    FileId:
      schema:
        $ref: "#/components/schemas/FileId"
      required: true
      name: fileId
      in: path
    ImportSourceId:
      schema:
        $ref: "#/components/schemas/ImportSourceId"
      required: true
      name: sourceId
      in: path
    UploadSessionId:
      schema:
        $ref: "#/components/schemas/UploadSessionId"
      required: true
      name: uploadSessionId
      in: path
    ApprovalId:
      schema:
        $ref: "#/components/schemas/ApprovalId"
      required: true
      name: approvalId
      in: path
    CommandId:
      schema:
        $ref: "#/components/schemas/CommandId"
      required: true
      description: Canvas entity ids are bounded opaque identifiers and cannot be URI schemes; enforced by the runtime Zod contract.
      name: commandId
      in: path
    VisualCapabilityId:
      schema:
        $ref: "#/components/schemas/VisualCapabilityId"
      required: true
      description: Canvas entity ids are bounded opaque identifiers and cannot be URI schemes; enforced by the runtime Zod contract.
      name: visualCapabilityId
      in: path
    ReleaseId:
      schema:
        $ref: "#/components/schemas/ReleaseId"
      required: true
      name: releaseId
      in: path
    ShareId:
      schema:
        $ref: "#/components/schemas/ShareId"
      required: true
      name: shareId
      in: path
    ExportId:
      schema:
        $ref: "#/components/schemas/ExportId"
      required: true
      name: exportId
      in: path
    ExportDeliveryId:
      schema:
        $ref: "#/components/schemas/ExportDeliveryId"
      required: true
      name: deliveryId
      in: path
    PreviewId:
      schema:
        $ref: "#/components/schemas/PreviewId"
      required: true
      name: previewId
      in: path
    ShareToken:
      schema:
        $ref: "#/components/schemas/ShareToken"
      required: true
      name: shareToken
      in: path
    PartNumber:
      schema:
        $ref: "#/components/schemas/PartNumber"
      required: true
      name: partNumber
      in: path
    ByteRange:
      schema:
        $ref: "#/components/schemas/ByteRange"
      required: false
      name: Range
      in: header
      description: A single RFC 9110 byte range; multipart ranges are deliberately unsupported
    IfMatch:
      schema:
        $ref: "#/components/schemas/IfMatch"
      required: true
      name: If-Match
      in: header
    IfNoneMatch:
      schema:
        $ref: "#/components/schemas/IfNoneMatch"
      required: false
      name: If-None-Match
      in: header
    IdempotencyKey:
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
      required: true
      name: Idempotency-Key
      in: header
    LastEventId:
      schema:
        $ref: "#/components/schemas/LastEventId"
      required: false
      name: Last-Event-ID
      in: header
paths:
  /system/live:
    get:
      operationId: getLiveness
      summary: Process is alive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /system/ready:
    get:
      operationId: getReadiness
      summary: Required infrastructure is ready
      security: []
      responses:
        "200":
          description: Required infrastructure is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
  /identity/me:
    get:
      operationId: getCurrentPrincipal
      summary: Current principal and default workspace
      responses:
        "200":
          description: Current principal and default workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Problem"
  /identity/preferences:
    get:
      operationId: getCommunicationPreferences
      summary: Current principal communication preferences
      responses:
        "200":
          description: Current principal communication preferences
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationPreferences"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateCommunicationPreferences
      summary: Current principal communication preferences updated with compare-and-swap
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunicationPreferencesRequest"
      responses:
        "200":
          description: Current principal communication preferences updated with compare-and-swap
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationPreferences"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /runtime/models:
    get:
      operationId: listRuntimeModels
      summary: Runtime models currently available through DeerFlow
      responses:
        "200":
          description: Runtime models currently available through DeerFlow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeModelList"
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
  /design-presets:
    get:
      operationId: listDesignPresets
      summary: Authoritative immutable Design preset catalog
      responses:
        "200":
          description: Authoritative immutable Design preset catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignPresetCatalog"
        "401":
          $ref: "#/components/responses/Problem"
  /knowledge/profiles:
    get:
      operationId: listKnowledgeProfiles
      summary: Cursor page of immutable Knowledge Profiles visible only to authorized Profile operators
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          name: limit
          in: query
        - schema:
            $ref: "#/components/schemas/KnowledgeProfileKind"
          required: true
          name: kind
          in: query
        - schema:
            $ref: "#/components/schemas/KnowledgeProfileStatus"
          required: false
          name: status
          in: query
      responses:
        "200":
          description: Cursor page of immutable Knowledge Profiles visible only to authorized Profile operators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfileList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createKnowledgeProfile
      summary: Canonical candidate Knowledge Profile created by an authorized Profile operator; kind, profile id, and canonical spec SHA-256 form its natural idempotency key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeProfileRequest"
      responses:
        "201":
          description: Canonical candidate Knowledge Profile created by an authorized Profile operator; kind, profile id, and canonical spec SHA-256 form its natural idempotency key
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /knowledge/profiles/{profileType}/{profileId}:
    get:
      operationId: getKnowledgeProfile
      summary: Immutable Knowledge Profile and current governed lifecycle status
      parameters:
        - $ref: "#/components/parameters/KnowledgeProfileType"
        - $ref: "#/components/parameters/KnowledgeProfileId"
      responses:
        "200":
          description: Immutable Knowledge Profile and current governed lifecycle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /knowledge/profiles/{profileType}/{profileId}/promote:
    post:
      operationId: promoteKnowledgeProfile
      summary: Knowledge Profile atomically promoted by one lifecycle step; adoption returns its immutable receipt
      parameters:
        - $ref: "#/components/parameters/KnowledgeProfileType"
        - $ref: "#/components/parameters/KnowledgeProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteKnowledgeProfileRequest"
      responses:
        "200":
          description: Knowledge Profile atomically promoted by one lifecycle step; adoption returns its immutable receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfilePromotionResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /knowledge/profiles/{profileType}/{profileId}/retire:
    post:
      operationId: retireKnowledgeProfile
      summary: Knowledge Profile retired with a locked expected-state transition
      parameters:
        - $ref: "#/components/parameters/KnowledgeProfileType"
        - $ref: "#/components/parameters/KnowledgeProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireKnowledgeProfileRequest"
      responses:
        "200":
          description: Knowledge Profile retired with a locked expected-state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /knowledge/profile-adoption-receipts:
    get:
      operationId: listKnowledgeProfileAdoptionReceipts
      summary: Cursor page of immutable global Knowledge Profile adoption receipts
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          name: limit
          in: query
        - schema:
            $ref: "#/components/schemas/KnowledgeProfileKind"
          required: false
          name: kind
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: false
          name: profileId
          in: query
      responses:
        "200":
          description: Cursor page of immutable global Knowledge Profile adoption receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeProfileAdoptionReceiptList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /runtime/knowledge/retrieve:
    post:
      operationId: retrieveRuntimeKnowledge
      summary: Citation-ready Knowledge results scoped to one authorized Run and pinned release
      security:
        - knowledgeGrant: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeToolRequest"
      responses:
        "200":
          description: Citation-ready Knowledge results scoped to one authorized Run and pinned release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeToolResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"
  /runtime/canvas/tools/execute:
    post:
      operationId: executeRuntimeCanvasTool
      summary: Canvas tool result or durable wait state scoped to one Agent session and toolCallId
      security:
        - canvasGrant: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasAgentToolInvocation"
      responses:
        "200":
          description: Canvas tool result or durable wait state scoped to one Agent session and toolCallId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasAgentToolResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /runtime/canvas/visuals/{visualCapabilityId}:
    get:
      operationId: getRuntimeCanvasVisual
      summary: Verified, short-lived Canvas visual capture bound to one Canvas grant
      security:
        - canvasGrant: []
      parameters:
        - $ref: "#/components/parameters/VisualCapabilityId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Verified, short-lived Canvas visual capture bound to one Canvas grant
          headers:
            ETag:
              $ref: "#/components/headers/ContentDigestETag"
            X-Content-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
            X-Canvas-Visual-Expires-At:
              schema:
                type: string
                format: date-time
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: Canvas visual capture digest matches If-None-Match
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/canvas-agent/state:
    put:
      operationId: syncCanvasAgentClientState
      summary: Current browser-owned Canvas selection and viewport synchronized to the active Agent session
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasClientStateSyncRequest"
      responses:
        "200":
          description: Current browser-owned Canvas selection and viewport synchronized to the active Agent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasClientStateSyncResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/canvas-agent/commands:
    get:
      operationId: listCanvasAgentClientCommands
      summary: Pending Canvas client commands scoped to the authenticated Product workspace session
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - schema:
            type: string
            minLength: 8
            maxLength: 128
          required: true
          name: clientSessionId
          in: query
        - schema:
            type: integer
            exclusiveMinimum: 0
          required: true
          name: projectSessionGeneration
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: ^[A-Za-z0-9_-]+$/u
          required: false
          name: after
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Pending Canvas client commands scoped to the authenticated Product workspace session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasClientCommandList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/canvas-agent/commands/{commandId}/ack:
    post:
      operationId: acknowledgeCanvasAgentClientCommand
      summary: Durable acknowledgement for a scoped Canvas client command
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CommandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasClientCommandAckRequest"
      responses:
        "200":
          description: Durable acknowledgement for a scoped Canvas client command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasClientCommandAck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      summary: Cursor page of Workspace members visible to Workspace members
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - schema:
            type: string
            minLength: 1
            maxLength: 2048
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          name: limit
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 160
            description: Case-insensitive display name or email search bound to the cursor
          required: false
          description: Case-insensitive display name or email search bound to the cursor
          name: q
          in: query
      responses:
        "200":
          description: Cursor page of Workspace members visible to Workspace members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberList"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /projects:
    get:
      operationId: listProjects
      summary: Cursor page of active Projects across every Workspace where the principal is an explicit member
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          name: limit
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 160
            description: Case-insensitive title and summary search bound to the cursor
          required: false
          description: Case-insensitive title and summary search bound to the cursor
          name: q
          in: query
        - schema:
            type: string
            enum:
              - owned
              - shared
            description: Filter owned Projects (owner role) or Projects shared as editor/viewer
          required: false
          description: Filter owned Projects (owner role) or Projects shared as editor/viewer
          name: relationship
          in: query
      responses:
        "200":
          description: Cursor page of active Projects across every Workspace where the principal is an explicit member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/Problem"
  /workspaces/{workspaceId}/projects:
    post:
      operationId: createProject
      summary: Project created with a default Thread and Board
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created with a default Thread and Board
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}:
    patch:
      operationId: updateProject
      summary: Project updated
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: archiveProject
      summary: Project soft-archived; active public Share grants are revoked
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Project soft-archived; active public Share grants are revoked
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/duplicate:
    post:
      operationId: duplicateProject
      summary: Private Project snapshot duplicated in the same Workspace without source Thread history or entries, Runs, Files, Releases, Shares, or Exports
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateProjectRequest"
      responses:
        "201":
          description: Private Project snapshot duplicated in the same Workspace without source Thread history or entries, Runs, Files, Releases, Shares, or Exports
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDuplicate"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      summary: Explicit Project members and roles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Explicit Project members and roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        "404":
          $ref: "#/components/responses/Problem"
  /projects/{projectId}/members/{principalId}:
    put:
      operationId: setProjectMemberRole
      summary: Project member added or assigned a role by an owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PrincipalId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProjectMemberRoleRequest"
      responses:
        "200":
          description: Project member added or assigned a role by an owner
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
