server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  absolute_redirect off;
  port_in_redirect off;

  location = /__health {
    access_log off;
    add_header Content-Type text/plain;
    try_files /__health =200;
  }

  location / {
    rewrite ^/(.+)/$ /$1 break;
    try_files $uri.html $uri/index.html $uri =404;
  }

  error_page 404 /404.html;
}
