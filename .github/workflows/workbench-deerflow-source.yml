name: 产品工作台 1.0.0 DeerFlow 源码镜像

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "当前 main 完整提交 SHA；源码归档和校验器必须来自同一提交"
        required: true
        type: string
      approve:
        description: "发布已核验的当前 1.0.0 源码输入，不执行生产部署"
        required: true
        type: boolean
        default: false

concurrency:
  group: workbench-deerflow-source
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Publish verified source-only input
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify exact source authorization and snapshot
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          python3 integrations/deerflow/runtime-security/verify_source.py
          python3 -B integrations/deerflow/runtime-security/test_source.py
      - name: Resolve source image tag
        id: source
        run: |
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workbench-deerflow-source:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable source-only image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: integrations/deerflow/runtime-security
          file: integrations/deerflow/runtime-security/source.Dockerfile
          target: source
          platforms: linux/amd64
          push: true
          load: false
          provenance: mode=max
          sbom: true
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Bind immutable image to exact source archive
        env:
          IMAGE_TAG: ${{ steps.source.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p output/source-image
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = 'integrations/deerflow/runtime-security/';
          const archive = readFileSync(root + 'source.tar.gz');
          const manifestBytes = readFileSync(root + 'source-snapshot.json');
          const snapshot = JSON.parse(manifestBytes);
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.match(process.env.IMAGE_DIGEST, /^sha256:[a-f0-9]{64}$/);
          const imageRef = `${process.env.IMAGE_TAG}@${process.env.IMAGE_DIGEST}`;
          writeFileSync('output/source-image/source-image.json', JSON.stringify({
            schema: 'workbench.deerflow-source-image.v1', applicationVersion: '1.0.0',
            repository: process.env.GITHUB_REPOSITORY, sourceCommit: process.env.GITHUB_SHA,
            upstreamCommit: snapshot.upstreamCommit, sourceImageId: snapshot.sourceImageId,
            sourceArchiveSha256: sha256(archive), sourceSnapshotSha256: sha256(manifestBytes),
            sourceFileCount: Object.keys(snapshot.fileSha256).length,
            imageRef, digest: process.env.IMAGE_DIGEST,
            workflowRun: { id: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
          }, null, 2) + '\n');
          writeFileSync(process.env.GITHUB_ENV, `SOURCE_IMAGE_REF=${imageRef}\n`, { flag: 'a' });
          NODE
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify source image and binding
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-deerflow-source.yml@refs/heads/main
        run: |
          set -euo pipefail
          cosign sign --yes --bundle output/source-image/source-image-signature.bundle.json "$SOURCE_IMAGE_REF"
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$SOURCE_IMAGE_REF" \
            > output/source-image/source-image-signature.verify.json
          cosign sign-blob --yes --bundle output/source-image/source-image.bundle.json output/source-image/source-image.json
          cosign verify-blob --bundle output/source-image/source-image.bundle.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com output/source-image/source-image.json
      - name: Upload signed current source image binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deerflow-source-1.0.0-${{ github.sha }}-${{ github.run_attempt }}
          path: output/source-image/
          if-no-files-found: error
          retention-days: 90
