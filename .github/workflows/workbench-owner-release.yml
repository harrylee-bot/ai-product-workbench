name: 产品工作台 1.0.0 项目所有者发布

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "完整 main 提交 SHA；构建与技术验收必须对应同一提交"
        required: true
        type: string
      approve:
        description: "项目所有者授权生成 1.0.0 生产发布包，保留全部技术检查"
        required: true
        default: false
        type: boolean

concurrency:
  group: workbench-owner-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Verify owner authorization and exact source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve == true
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - workbench-local-build
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.WORKBENCH_CHECKOUT_SSH_KEY }}
      - name: Verify dedicated local runner and prepare job isolation
        run: python3 scripts/workbench-local-runner.py prepare
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build contracts used by delivery verifier
        run: npm run build --workspace @workbench/workbench-contracts
      - name: Install browser for delivery verifier regressions
        run: npx playwright install --with-deps chromium
      - name: Test local runner safety contracts
        run: |-
          python3 scripts/workbench-local-runner.test.py
          python3 scripts/workbench-ci-artifacts.test.py
          node --test scripts/workbench-local-runner-workflow.test.mjs
      - name: Validate owner release contract
        run: |
          node scripts/owner-release.mjs contract
          node --test scripts/owner-release.test.mjs scripts/owner-image-attestations.test.mjs scripts/runtime-node-toolchain.test.mjs scripts/workbench-delivery-http-smoke.test.mjs
          python3 scripts/workbench-owner-deploy.test.py
          npm run deployment:images:check
      - name: Bind owner authorization to exact source
        id: source
        env:
          OWNER_RELEASE_COMMIT: ${{ inputs.source_commit }}
          OWNER_RELEASE_APPROVED: ${{ inputs.approve }}
        run: |
          node scripts/owner-release.mjs source --output output/owner-source.json
          echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require immutable build and infrastructure inputs
        env:
          WORKBENCH_NODE_IMAGE: ${{ vars.WORKBENCH_NODE_IMAGE }}
          WORKBENCH_DEERFLOW_NODE_IMAGE_REF: ${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
          WORKBENCH_DEERFLOW_BASE_IMAGE_REF: ${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
          WORKBENCH_NGINX_IMAGE: ${{ vars.WORKBENCH_NGINX_IMAGE }}
          WORKBENCH_POSTGRES_IMAGE: ${{ vars.WORKBENCH_POSTGRES_IMAGE }}
          WORKBENCH_CI_POSTGRES_IMAGE: ${{ vars.WORKBENCH_CI_POSTGRES_IMAGE }}
          WORKBENCH_DOCLING_IMAGE: ${{ vars.WORKBENCH_DOCLING_IMAGE }}
          WORKBENCH_CLAMAV_IMAGE: ${{ vars.WORKBENCH_CLAMAV_IMAGE }}
          WORKBENCH_MINIO_IMAGE: ${{ vars.WORKBENCH_MINIO_IMAGE }}
          WORKBENCH_MINIO_MC_IMAGE: ${{ vars.WORKBENCH_MINIO_MC_IMAGE }}
          WORKBENCH_DEX_IMAGE: ${{ vars.WORKBENCH_DEX_IMAGE }}
        run: |
          node --input-type=module <<'NODE'
          const names = [
            'WORKBENCH_NODE_IMAGE', 'WORKBENCH_DEERFLOW_NODE_IMAGE_REF',
            'WORKBENCH_DEERFLOW_BASE_IMAGE_REF', 'WORKBENCH_NGINX_IMAGE',
            'WORKBENCH_POSTGRES_IMAGE', 'WORKBENCH_CI_POSTGRES_IMAGE',
            'WORKBENCH_DOCLING_IMAGE', 'WORKBENCH_CLAMAV_IMAGE',
            'WORKBENCH_MINIO_IMAGE', 'WORKBENCH_MINIO_MC_IMAGE', 'WORKBENCH_DEX_IMAGE',
          ];
          for (const name of names) {
            if (!/^[^\s]+@sha256:[a-f0-9]{64}$/.test(process.env[name] ?? '')) {
              throw new Error(`${name} must contain an immutable image digest`);
            }
          }
          NODE
      - name: Retain exact-attempt source binding
        run: python3 scripts/workbench-ci-artifacts.py upload
        env:
          WORKBENCH_ARTIFACT_NAME: owner-source-${{ github.run_attempt }}
          WORKBENCH_ARTIFACT_PATH: output/owner-source.json
          WORKBENCH_ARTIFACT_RETENTION_DAYS: "1"
      - name: Clean only verified current job resources
        if: always()
        run: python3 scripts/workbench-local-runner.py cleanup

  ci:
    name: Require complete CI for this candidate
    needs: [ source ]
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - workbench-local-build
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.WORKBENCH_CHECKOUT_SSH_KEY }}
      - name: Verify dedicated local runner and prepare job isolation
        run: python3 scripts/workbench-local-runner.py prepare
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require already successful exact candidate technical checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/owner-release.mjs wait-ci \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --output output/owner-ci.json \
            --require-complete true
      - name: Retain exact-attempt CI evidence
        run: python3 scripts/workbench-ci-artifacts.py upload
        env:
          WORKBENCH_ARTIFACT_NAME: owner-ci-${{ github.run_attempt }}
          WORKBENCH_ARTIFACT_PATH: output/owner-ci.json
          WORKBENCH_ARTIFACT_RETENTION_DAYS: "1"
      - name: Clean only verified current job resources
        if: always()
        run: python3 scripts/workbench-local-runner.py cleanup

  images:
    name: Production image / ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve == true
    needs:
      - source
      - ci
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - workbench-local-build
    # DeerFlow and export-worker images can take several minutes to pull on
    # the isolated ARM64 runner; leave enough room for the immutable pull,
    # SBOM, and vulnerability database download without weakening any gate.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: deerflow
            dockerfile: integrations/deerflow/Dockerfile
            target: runtime
            build_args: |
              DEERFLOW_BASE_IMAGE=${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
              DEERFLOW_NODE_IMAGE=${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
              DEERFLOW_SOURCE_COMMIT=${{ vars.WORKBENCH_DEERFLOW_COMMIT }}
              WORKBENCH_SOURCE_COMMIT=${{ github.sha }}
          - name: export-worker
            dockerfile: apps/workbench-export-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner
            build_args: |
              WORKBENCH_PREVIEW_ORIGIN=${{ vars.WORKBENCH_PREVIEW_ORIGIN }}
              WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL=${{ vars.WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL }}
              NEXT_PUBLIC_KNOWLEDGE_APP_URL=${{ format('https://{0}', vars.WORKBENCH_KNOWLEDGE_BASE_URL) }}
              NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL=${{ vars.NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL }}
              NEXT_PUBLIC_WORKBENCH_FORUM_URL=${{ vars.NEXT_PUBLIC_WORKBENCH_FORUM_URL }}
              NEXT_PUBLIC_WORKBENCH_PRIVACY_URL=${{ vars.NEXT_PUBLIC_WORKBENCH_PRIVACY_URL }}
              WORKBENCH_TYPES_PREVALIDATED=1
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: api
            dockerfile: apps/workbench-api/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: api-migrator
            dockerfile: apps/workbench-api/Dockerfile
            target: migrator
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: runtime-worker
            dockerfile: apps/workbench-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: file-worker
            dockerfile: apps/workbench-file-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: import-worker
            dockerfile: apps/workbench-import-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: preview
            dockerfile: apps/workbench-preview/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
          - name: quartz
            dockerfile: apps/knowledge/Dockerfile
            target: immutable-runner
            build_args: |
              QUARTZ_BASE_URL=${{ vars.WORKBENCH_KNOWLEDGE_BASE_URL }}
              KNOWLEDGE_WEB_URL=${{ vars.WORKBENCH_WEB_ORIGIN }}
              NODE_IMAGE=${{ vars.WORKBENCH_NODE_IMAGE }}
              NGINX_IMAGE=${{ vars.WORKBENCH_NGINX_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.WORKBENCH_CHECKOUT_SSH_KEY }}
      - name: Verify dedicated local runner and prepare job isolation
        run: python3 scripts/workbench-local-runner.py prepare
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: ${{ env.WORKBENCH_JOB_BUILDER }}
          driver: docker-container
          endpoint: unix:///var/run/docker.sock
          driver-opts: |-
            memory=4294967296
            memory-swap=4294967296
            cpu-period=100000
            cpu-quota=200000
            network=bridge
            env.http_proxy=${{ env.WORKBENCH_BUILD_PROXY }}
            env.https_proxy=${{ env.WORKBENCH_BUILD_PROXY }}
            env.no_proxy=${{ env.WORKBENCH_BUILD_NO_PROXY }}
          buildkitd-config: deploy/workbench-buildkitd.toml
          buildkitd-flags: --oci-worker-net=bridge
          cleanup: false
      - name: Verify active builder isolation and resource limits
        run: python3 scripts/workbench-local-runner.py verify-builder

      - name: Require approved production build inputs
        env:
          WORKBENCH_WEB_ORIGIN: ${{ vars.WORKBENCH_WEB_ORIGIN }}
          WORKBENCH_PREVIEW_ORIGIN: ${{ vars.WORKBENCH_PREVIEW_ORIGIN }}
          WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL: ${{ vars.WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL }}
          WORKBENCH_KNOWLEDGE_BASE_URL: ${{ vars.WORKBENCH_KNOWLEDGE_BASE_URL }}
          WORKBENCH_PUBLIC_REGISTRATION_ENABLED: ${{ vars.WORKBENCH_PUBLIC_REGISTRATION_ENABLED }}
          NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL }}
          NEXT_PUBLIC_WORKBENCH_FORUM_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_FORUM_URL }}
          NEXT_PUBLIC_WORKBENCH_PRIVACY_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_PRIVACY_URL }}
        run: |
          case "$WORKBENCH_WEB_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          case "$WORKBENCH_PREVIEW_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          case "$WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL" in https://*) ;; *) exit 1 ;; esac
          test "$WORKBENCH_WEB_ORIGIN" != "$WORKBENCH_PREVIEW_ORIGIN"
          test -n "$WORKBENCH_KNOWLEDGE_BASE_URL"
          case "$WORKBENCH_KNOWLEDGE_BASE_URL" in http://*|https://*|/*|*' '*) exit 1 ;; esac
          case "$WORKBENCH_PUBLIC_REGISTRATION_ENABLED" in true|false) ;; *) exit 1 ;; esac

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require fixed DeerFlow source and base image pins
        if: matrix.name == 'deerflow'
        env:
          DEERFLOW_BASE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
          DEERFLOW_NODE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
          DEERFLOW_SOURCE_COMMIT: ${{ vars.WORKBENCH_DEERFLOW_COMMIT }}
        run: |
          test -n "$DEERFLOW_BASE_IMAGE"
          printf '%s' "$DEERFLOW_BASE_IMAGE" | grep -Eq '@sha256:[a-f0-9]{64}$'
          test -n "$DEERFLOW_NODE_IMAGE"
          printf '%s' "$DEERFLOW_NODE_IMAGE" | grep -Eq '@sha256:[a-f0-9]{64}$'
          printf '%s' "$DEERFLOW_SOURCE_COMMIT" | grep -Eq '^[a-f0-9]{40}$'

      - name: Prepare image evidence directory
        run: mkdir -p output

      - name: Freeze public image build configuration
        id: build-configuration
        env:
          WORKBENCH_IMAGE_BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          path="output/build-configuration-${{ matrix.name }}.json"
          node scripts/write-production-build-configuration.mjs \
            --id "${{ matrix.name }}" \
            --source-commit "$GITHUB_SHA" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --target "${{ matrix.target }}" \
            --build-args-env WORKBENCH_IMAGE_BUILD_ARGS \
            > "$path"
          sha256="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(value.payloadSha256)' "$path")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} production image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.workbench.build-configuration-sha256=${{ steps.build-configuration.outputs.sha256 }}
          tags: ghcr.io/${{ github.repository_owner }}/workbench-${{ matrix.name }}:${{ github.sha }}
          push: true
          load: false
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          builder: ${{ env.WORKBENCH_JOB_BUILDER }}

      - name: Resolve image reference
        id: image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workbench-${{ matrix.name }}:${GITHUB_SHA}"
          digest="${{ steps.build.outputs.digest }}"
          printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          ref="$ref@$digest"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Release temporary builder cache before image inspection
        run: |-
          python3 scripts/workbench-local-runner.py release-builder
      - name: Run isolated AMD64 image compatibility check
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: python3 scripts/workbench-local-runner.py image-smoke --image "$IMAGE_REF" --name "${{ matrix.name }}" --commit "$GITHUB_SHA"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: registry:${{ steps.image.outputs.ref }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: output/sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false
        env:
          SYFT_PLATFORM: linux/amd64

      - name: Scan image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: output/trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          cache: false
          timeout: 30m

      - name: Install Cosign
        id: cosign_installer
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Retry Cosign install with pinned binary
        if: steps.cosign_installer.outcome == 'failure'
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_ARM64_SHA256: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) asset=cosign-linux-arm64 ;;
            *) echo "Unsupported fallback architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          target="$RUNNER_TEMP/cosign"
          curl --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 --http1.1 -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}" \
            -o "$target"
          printf '%s  %s\n' "$COSIGN_ARM64_SHA256" "$target" | sha256sum -c -
          chmod 0755 "$target"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$target" version

      - name: Sign SLSA provenance and SPDX image attestations
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          node scripts/owner-image-attestations.mjs predicate \
            --configuration "${{ steps.build-configuration.outputs.path }}" \
            --output "output/provenance-${{ matrix.name }}.predicate.json"
          cosign attest --yes --type slsaprovenance1 \
            --predicate "output/provenance-${{ matrix.name }}.predicate.json" \
            --bundle "output/provenance-${{ matrix.name }}.bundle.json" "$IMAGE_REF"
          cosign attest --yes --type spdxjson \
            --predicate "output/sbom-${{ matrix.name }}.spdx.json" \
            --bundle "output/sbom-attestation-${{ matrix.name }}.bundle.json" "$IMAGE_REF"

      - name: Sign and verify immutable image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-owner-release.yml@refs/heads/main
        run: |
          cosign sign --yes --bundle "output/cosign-${{ matrix.name }}.bundle.json" "$IMAGE_REF"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" > "output/cosign-${{ matrix.name }}.verify.json"

      - name: Write immutable image evidence record
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/write-production-image-record.mjs \
            --id "${{ matrix.name }}" \
            --image-ref "$IMAGE_REF" \
            --digest "$IMAGE_DIGEST" \
            --source-commit "$GITHUB_SHA" \
            --build-configuration-path "${{ steps.build-configuration.outputs.path }}" \
            --sbom-path "output/sbom-${{ matrix.name }}.spdx.json" \
            --sbom-attestation-path "output/sbom-attestation-${{ matrix.name }}.bundle.json" \
            --provenance-path "output/provenance-${{ matrix.name }}.bundle.json" \
            --signature-path "output/cosign-${{ matrix.name }}.bundle.json" \
            --verification-path "output/cosign-${{ matrix.name }}.verify.json" \
            --vulnerability-path "output/trivy-${{ matrix.name }}.json" \
            > "output/image-record-${{ matrix.name }}.json"

      - name: Verify exact image attestation signatures and payload bindings
        run: |
          node scripts/owner-image-attestations.mjs verify \
            --record "output/image-record-${{ matrix.name }}.json" \
            --evidence-root output

      - name: Retain image evidence
        if: always()
        run: python3 scripts/workbench-ci-artifacts.py upload
        env:
          WORKBENCH_ARTIFACT_NAME: owner-image-evidence-${{ github.run_attempt }}-${{ matrix.name }}
          WORKBENCH_ARTIFACT_PATH: output
          WORKBENCH_ARTIFACT_RETENTION_DAYS: "1"
      - name: Clean only verified current job resources
        if: always()
        run: python3 scripts/workbench-local-runner.py cleanup
    env:
      WORKBENCH_IMAGE_ID: ${{ matrix.name }}

  release:
    name: Sign deployable release after all technical checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve == true
    needs: [ source, ci, images ]
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - workbench-local-build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.source_commit }}
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.WORKBENCH_CHECKOUT_SSH_KEY }}
      - name: Verify dedicated local runner and prepare job isolation
        run: python3 scripts/workbench-local-runner.py prepare
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download source binding
        run: python3 scripts/workbench-ci-artifacts.py download
        env:
          WORKBENCH_ARTIFACT_NAME: owner-source-${{ github.run_attempt }}
          WORKBENCH_ARTIFACT_PATH: output/binding
      - name: Download passed CI evidence
        run: python3 scripts/workbench-ci-artifacts.py download
        env:
          WORKBENCH_ARTIFACT_NAME: owner-ci-${{ github.run_attempt }}
          WORKBENCH_ARTIFACT_PATH: output/binding
      - name: Download complete image evidence
        run: python3 scripts/workbench-ci-artifacts.py download
        env:
          WORKBENCH_ARTIFACT_NAME: owner-image-evidence-${{ github.run_attempt }}-*
          WORKBENCH_ARTIFACT_PATH: output/image-evidence
          WORKBENCH_ARTIFACT_PATTERN: "true"
      - name: Assemble exact candidate release package
        run: |
          node scripts/owner-release.mjs assemble \
            --source output/binding/owner-source.json \
            --ci output/binding/owner-ci.json \
            --records output/image-evidence \
            --output output/release
          cp output/image-evidence/cosign-*.bundle.json output/release/
          cp output/image-evidence/provenance-*.bundle.json output/release/
          cp output/image-evidence/sbom-attestation-*.bundle.json output/release/
          cp output/image-evidence/sbom-*.spdx.json output/release/
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        id: cosign_installer
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Retry Cosign install with pinned binary
        if: steps.cosign_installer.outcome == 'failure'
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_ARM64_SHA256: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) asset=cosign-linux-arm64 ;;
            *) echo "Unsupported fallback architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          target="$RUNNER_TEMP/cosign"
          curl --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 --http1.1 -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}" \
            -o "$target"
          printf '%s  %s\n' "$COSIGN_ARM64_SHA256" "$target" | sha256sum -c -
          chmod 0755 "$target"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$target" version
      - name: Sign and verify complete release
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-owner-release.yml@refs/heads/main
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle output/release/production-image-manifest.bundle.json output/release/production-image-manifest.json
          cosign sign-blob --yes --bundle output/release/owner-release.bundle.json output/release/owner-release.json
          node scripts/owner-release.mjs verify \
            --manifest output/release/owner-release.json \
            --bundle output/release/owner-release.bundle.json \
            --image-manifest output/release/production-image-manifest.json \
            --image-bundle output/release/production-image-manifest.bundle.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --expected-commit "$GITHUB_SHA" \
            > output/release/verified-images.json
      - name: Retain deployable 1.0.0 release package
        run: python3 scripts/workbench-ci-artifacts.py upload
        env:
          WORKBENCH_ARTIFACT_NAME: owner-release-1.0.0-${{ github.sha }}-${{ github.run_attempt }}
          WORKBENCH_ARTIFACT_PATH: output/release
          WORKBENCH_ARTIFACT_RETENTION_DAYS: "7"
      - name: Clean only verified current job resources
        if: always()
        run: python3 scripts/workbench-local-runner.py cleanup
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
  # Match the CI checkout transport on the same dedicated ARM64 runner.
  GIT_CONFIG_COUNT: 3
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  GIT_CONFIG_KEY_1: http.maxRequests
  GIT_CONFIG_VALUE_1: "1"
  GIT_CONFIG_KEY_2: http.lowSpeedLimit
  GIT_CONFIG_VALUE_2: "0"
