name: 产品工作台生产验收与硬切

on:
  workflow_dispatch:
    inputs:
      release_chain_run_id:
        description: "Successful production workbench-ci run ID containing the signed G0-G2 release chain"
        required: true
        type: string
      evidence_package_url:
        description: "Credential-free HTTPS URL for the immutable hard-cut evidence package JSON"
        required: true
        type: string
      evidence_package_sha256:
        description: "SHA-256 of the immutable evidence package bytes"
        required: true
        type: string

concurrency:
  group: workbench-production-acceptance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  production-acceptance:
    name: Verify G5-G11 and enforce candidate-bound hard cut
    runs-on: ubuntu-latest
    environment:
      name: production-acceptance
    timeout-minutes: 20
    steps:
      - name: Resolve successful production CI run
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          VERIFIER_COMMIT: ${{ vars.WORKBENCH_ACCEPTANCE_VERIFIER_COMMIT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/production"
          printf '%s' "$RELEASE_CHAIN_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$VERIFIER_COMMIT" | grep -Eq '^[a-f0-9]{40}$'
          chain_root="$RUNNER_TEMP/workbench-release-chain"
          rm -rf "$chain_root"
          mkdir -p "$chain_root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CHAIN_RUN_ID" > "$chain_root/run.json"
          RUN_METADATA="$chain_root/run.json" node --input-type=module - "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.env.RUN_METADATA, 'utf8'));
          const expected = {
            event: 'push',
            head_branch: 'production',
            status: 'completed',
            conclusion: 'success',
            path: '.github/workflows/workbench-ci.yml',
          };
          for (const [field, value] of Object.entries(expected)) {
            if (run[field] !== value) throw new Error(`release-chain run ${field} is not ${value}`);
          }
          if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('release-chain run belongs to another repository');
          }
          if (!/^[a-f0-9]{40}$/.test(run.head_sha ?? '')) throw new Error('release-chain run head_sha is invalid');
          if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) throw new Error('release-chain run_attempt is invalid');
          fs.appendFileSync(process.argv[2], `head_sha=${run.head_sha}\nrun_attempt=${run.run_attempt}\n`);
          NODE

      - name: Download CI-owned verified release chain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          RELEASE_CHAIN_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh run download "$RELEASE_CHAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "verified-release-chain-$RELEASE_CHAIN_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/workbench-release-chain/artifact"

      - name: Download CI-owned production image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          RELEASE_CHAIN_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh run download "$RELEASE_CHAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-image-manifest-$RELEASE_CHAIN_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/workbench-production-images/artifact"

      - name: Download CI-owned deployment configuration
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          RELEASE_CHAIN_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh run download "$RELEASE_CHAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "production-deployment-config-$RELEASE_CHAIN_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/workbench-deployment-config/artifact"

      - name: Validate CI-owned G4 artifact envelope
        env:
          IMAGE_ROOT: ${{ runner.temp }}/workbench-production-images/artifact
        run: |
          set -euo pipefail
          IMAGE_ROOT="$IMAGE_ROOT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const expectedFiles = [
            'cosign-api-migrator.bundle.json',
            'cosign-api.bundle.json',
            'cosign-deerflow.bundle.json',
            'cosign-export-worker.bundle.json',
            'cosign-file-worker.bundle.json',
            'cosign-import-worker.bundle.json',
            'cosign-preview.bundle.json',
            'cosign-quartz.bundle.json',
            'cosign-runtime-worker.bundle.json',
            'cosign-web.bundle.json',
            'production-image-manifest.bundle.json',
            'production-image-manifest.json',
          ];
          const actualFiles = fs.readdirSync(process.env.IMAGE_ROOT).sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            throw new Error(`production-image-manifest artifact has unexpected files: ${actualFiles.join(',')}`);
          }
          for (const name of actualFiles) {
            const file = path.join(process.env.IMAGE_ROOT, name);
            if (!fs.lstatSync(file).isFile() || fs.lstatSync(file).isSymbolicLink()) {
              throw new Error(`${name} is not a regular file`);
            }
          }
          NODE

      - name: Validate CI-owned deployment configuration envelope
        env:
          CONFIG_ROOT: ${{ runner.temp }}/workbench-deployment-config/artifact
        run: |
          set -euo pipefail
          CONFIG_ROOT="$CONFIG_ROOT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const expectedFiles = [
            'production-deployment-config.bundle.json',
            'production-deployment-config.json',
          ];
          const actualFiles = fs.readdirSync(process.env.CONFIG_ROOT).sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            throw new Error(`production-deployment-config artifact has unexpected files: ${actualFiles.join(',')}`);
          }
          for (const name of actualFiles) {
            const file = path.join(process.env.CONFIG_ROOT, name);
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`${name} is not a regular file`);
          }
          NODE

      - name: Derive candidate only from the CI artifact
        id: release_chain
        env:
          CHAIN_ROOT: ${{ runner.temp }}/workbench-release-chain/artifact
          EXPECTED_HEAD_SHA: ${{ steps.ci_run.outputs.head_sha }}
        run: |
          set -euo pipefail
          CHAIN_OUTPUT="$GITHUB_OUTPUT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const expectedFiles = [
            'g0.json', 'g1-inventory.ndjson', 'g1-manifest.json', 'g2-receipt.json',
            'release-chain.bundle.json', 'release-chain.json',
          ];
          const actualFiles = fs.readdirSync(process.env.CHAIN_ROOT).sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            throw new Error(`verified-release-chain artifact has unexpected files: ${actualFiles.join(',')}`);
          }
          for (const name of actualFiles) {
            if (!fs.lstatSync(path.join(process.env.CHAIN_ROOT, name)).isFile()) throw new Error(`${name} is not a regular file`);
          }
          const chain = JSON.parse(fs.readFileSync(path.join(process.env.CHAIN_ROOT, 'release-chain.json'), 'utf8'));
          if (chain.status !== 'PASS') throw new Error('release chain status must be PASS');
          if (chain.sourceCommit !== process.env.EXPECTED_HEAD_SHA) throw new Error('release chain sourceCommit does not match CI head_sha');
          if (!/^sha256:[a-f0-9]{64}$/.test(chain.chainId ?? '')) throw new Error('release chain ID is invalid');
          if (!/^sha256:[a-f0-9]{64}$/.test(chain.candidateId ?? '')) throw new Error('release candidate ID is invalid');
          if (!/^[A-Za-z0-9][A-Za-z0-9._:/-]{1,127}$/.test(chain.signedTag ?? '')) throw new Error('release signed tag is invalid');
          const hashes = {
            g0_sha256: chain.g0?.approvalSha256,
            g1_manifest_sha256: chain.g1?.manifestSha256,
            g1_inventory_sha256: chain.g1?.inventorySha256,
            g2_sha256: chain.g2?.receiptSha256,
          };
          for (const [name, value] of Object.entries(hashes)) {
            if (!/^[a-f0-9]{64}$/.test(value ?? '')) throw new Error(`${name} is invalid`);
          }
          const outputs = {
            chain_id: chain.chainId,
            candidate_id: chain.candidateId,
            source_commit: chain.sourceCommit,
            signed_tag: chain.signedTag,
            ...hashes,
          };
          fs.appendFileSync(process.env.CHAIN_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Checkout verifier source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ vars.WORKBENCH_ACCEPTANCE_VERIFIER_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Verify CI-owned G4 images and bind the control catalog
        id: g4
        env:
          IMAGE_ROOT: ${{ runner.temp }}/workbench-production-images/artifact
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          RELEASE_CHAIN_ID: ${{ steps.release_chain.outputs.chain_id }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          manifest="$IMAGE_ROOT/production-image-manifest.json"
          bundle="$IMAGE_ROOT/production-image-manifest.bundle.json"
          catalog="schemas/evidence/governance/production-acceptance-control-catalog.v1.json"
          test -f "$catalog" && test ! -L "$catalog"
          node scripts/production-image-inventory.mjs \
            --manifest "$manifest" \
            --bundle "$bundle" \
            --signature-bundle-root "$IMAGE_ROOT" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            --expected-commit "$SOURCE_COMMIT" \
            --release-chain-id "$RELEASE_CHAIN_ID"
          node --input-type=module - "$catalog" <<'NODE'
          import { loadProductionAcceptanceControlCatalog } from './scripts/production-acceptance/catalog.mjs';
          await loadProductionAcceptanceControlCatalog({ catalogPath: process.argv[2] });
          NODE
          printf 'image_manifest_sha256=%s\n' "$(sha256sum "$manifest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'control_catalog_sha256=%s\n' "$(sha256sum "$catalog" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify and recompute the signed G0-G2 release chain
        env:
          CHAIN_ROOT: ${{ runner.temp }}/workbench-release-chain/artifact
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          SIGNED_TAG: ${{ steps.release_chain.outputs.signed_tag }}
          G0_SHA256: ${{ steps.release_chain.outputs.g0_sha256 }}
          G1_MANIFEST_SHA256: ${{ steps.release_chain.outputs.g1_manifest_sha256 }}
          G1_INVENTORY_SHA256: ${{ steps.release_chain.outputs.g1_inventory_sha256 }}
          G2_SHA256: ${{ steps.release_chain.outputs.g2_sha256 }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "$CHAIN_ROOT/release-chain.bundle.json" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$CHAIN_ROOT/release-chain.json"
          node scripts/verify-release-chain.mjs \
            --g0 "$CHAIN_ROOT/g0.json" \
            --g1-manifest "$CHAIN_ROOT/g1-manifest.json" \
            --g1-inventory "$CHAIN_ROOT/g1-inventory.ndjson" \
            --g2 "$CHAIN_ROOT/g2-receipt.json" \
            --commit "$SOURCE_COMMIT" \
            --tag "$SIGNED_TAG" \
            --g0-sha256 "$G0_SHA256" \
            --g1-manifest-sha256 "$G1_MANIFEST_SHA256" \
            --g1-inventory-sha256 "$G1_INVENTORY_SHA256" \
            --g2-sha256 "$G2_SHA256" \
            > "$RUNNER_TEMP/workbench-release-chain/recomputed.json"
          node --input-type=module - "$CHAIN_ROOT/release-chain.json" "$RUNNER_TEMP/workbench-release-chain/recomputed.json" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.deepEqual(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')), JSON.parse(fs.readFileSync(process.argv[3], 'utf8')));
          NODE

      - name: Verify signed deployment configuration against G1, G4, and selected run attempt
        id: deployment_config
        env:
          CONFIG_ROOT: ${{ runner.temp }}/workbench-deployment-config/artifact
          IMAGE_MANIFEST_PATH: ${{ runner.temp }}/workbench-production-images/artifact/production-image-manifest.json
          CANDIDATE_ID: ${{ steps.release_chain.outputs.candidate_id }}
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          SIGNED_TAG: ${{ steps.release_chain.outputs.signed_tag }}
          RELEASE_CHAIN_ID: ${{ steps.release_chain.outputs.chain_id }}
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          RELEASE_CHAIN_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { loadVerifiedProductionDeploymentConfig } from './scripts/production-deployment-config.mjs';
          import { productionImageDigestBinding } from './scripts/production-image-inventory.mjs';
          const imageBytes = fs.readFileSync(process.env.IMAGE_MANIFEST_PATH);
          const imageManifest = JSON.parse(imageBytes.toString('utf8'));
          const imageManifestSha256 = createHash('sha256').update(imageBytes).digest('hex');
          const images = productionImageDigestBinding({
            manifest: imageManifest,
            expectedCommit: process.env.SOURCE_COMMIT,
            expectedReleaseChainId: process.env.RELEASE_CHAIN_ID,
          });
          const loaded = loadVerifiedProductionDeploymentConfig({
            manifestPath: path.join(process.env.CONFIG_ROOT, 'production-deployment-config.json'),
            bundlePath: path.join(process.env.CONFIG_ROOT, 'production-deployment-config.bundle.json'),
            certificateIdentity: process.env.CERTIFICATE_IDENTITY,
            certificateOidcIssuer: process.env.CERTIFICATE_OIDC_ISSUER,
            expected: {
              candidateId: process.env.CANDIDATE_ID,
              sourceCommit: process.env.SOURCE_COMMIT,
              signedTag: process.env.SIGNED_TAG,
              releaseChainId: process.env.RELEASE_CHAIN_ID,
              imageManifestSha256,
              images,
              githubRunId: process.env.RELEASE_CHAIN_RUN_ID,
              githubRunAttempt: process.env.RELEASE_CHAIN_RUN_ATTEMPT,
            },
          });
          const outputs = {
            manifest_sha256: loaded.manifestSha256,
            config_sha256: loaded.binding.configSha256,
            migration_sha256: loaded.binding.migrationSha256,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Validate immutable evidence and trust-policy inputs
        env:
          EVIDENCE_PACKAGE_URL: ${{ inputs.evidence_package_url }}
          EVIDENCE_PACKAGE_SHA256: ${{ inputs.evidence_package_sha256 }}
          TRUST_POLICY_URL: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_URL }}
          TRUST_POLICY_SHA256: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s' "$EVIDENCE_PACKAGE_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          printf '%s' "$TRUST_POLICY_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          node --input-type=module - "$EVIDENCE_PACKAGE_URL" "$TRUST_POLICY_URL" <<'NODE'
          import { validateImmutableHttpsUrl } from './scripts/verify-workbench-hard-cut-acceptance.mjs';
          validateImmutableHttpsUrl(process.argv[2]);
          validateImmutableHttpsUrl(process.argv[3]);
          NODE

      - name: Download and hash external hard-cut evidence package
        env:
          EVIDENCE_PACKAGE_URL: ${{ inputs.evidence_package_url }}
          EVIDENCE_PACKAGE_SHA256: ${{ inputs.evidence_package_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workbench-hard-cut"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 104857600 --output "$RUNNER_TEMP/workbench-hard-cut/package.json" "$EVIDENCE_PACKAGE_URL"
          actual="$(sha256sum "$RUNNER_TEMP/workbench-hard-cut/package.json" | awk '{print $1}')"
          test "$actual" = "$EVIDENCE_PACKAGE_SHA256"

      - name: Download externally governed production trust policy
        env:
          TRUST_POLICY_URL: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_URL }}
          TRUST_POLICY_SHA256: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_SHA256 }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/workbench-hard-cut/production-trust-policy.json"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 1048576 --output "$policy" "$TRUST_POLICY_URL"
          actual="$(sha256sum "$policy" | awk '{print $1}')"
          test "$actual" = "$TRUST_POLICY_SHA256"

      - name: Verify external G5-G11 evidence and independent approvals
        env:
          PACKAGE_PATH: ${{ runner.temp }}/workbench-hard-cut/package.json
          PACKAGE_SHA256: ${{ inputs.evidence_package_sha256 }}
          EVIDENCE_ROOT: ${{ runner.temp }}/workbench-hard-cut/evidence
          TRUST_POLICY_PATH: ${{ runner.temp }}/workbench-hard-cut/production-trust-policy.json
          TRUST_POLICY_SHA256: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_SHA256 }}
          CANDIDATE_ID: ${{ steps.release_chain.outputs.candidate_id }}
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          SIGNED_TAG: ${{ steps.release_chain.outputs.signed_tag }}
          RELEASE_CHAIN_ID: ${{ steps.release_chain.outputs.chain_id }}
          PRODUCTION_IMAGE_MANIFEST_PATH: ${{ runner.temp }}/workbench-production-images/artifact/production-image-manifest.json
          PRODUCTION_IMAGE_MANIFEST_SHA256: ${{ steps.g4.outputs.image_manifest_sha256 }}
          DEPLOYMENT_CONFIG_MANIFEST_PATH: ${{ runner.temp }}/workbench-deployment-config/artifact/production-deployment-config.json
          DEPLOYMENT_CONFIG_MANIFEST_SHA256: ${{ steps.deployment_config.outputs.manifest_sha256 }}
          CONTROL_CATALOG_PATH: ${{ github.workspace }}/schemas/evidence/governance/production-acceptance-control-catalog.v1.json
          CONTROL_CATALOG_SHA256: ${{ steps.g4.outputs.control_catalog_sha256 }}
        run: |
          set -euo pipefail
          node scripts/verify-workbench-hard-cut-acceptance.mjs \
            --package "$PACKAGE_PATH" \
            --package-sha256 "$PACKAGE_SHA256" \
            --evidence-root "$EVIDENCE_ROOT" \
            --trust-policy "$TRUST_POLICY_PATH" \
            --trust-policy-sha256 "$TRUST_POLICY_SHA256" \
            --expected-candidate-id "$CANDIDATE_ID" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-signed-tag "$SIGNED_TAG" \
            --expected-chain-id "$RELEASE_CHAIN_ID" \
            --production-image-manifest "$PRODUCTION_IMAGE_MANIFEST_PATH" \
            --production-image-manifest-sha256 "$PRODUCTION_IMAGE_MANIFEST_SHA256" \
            --deployment-config-manifest "$DEPLOYMENT_CONFIG_MANIFEST_PATH" \
            --deployment-config-manifest-sha256 "$DEPLOYMENT_CONFIG_MANIFEST_SHA256" \
            --control-catalog "$CONTROL_CATALOG_PATH" \
            --control-catalog-sha256 "$CONTROL_CATALOG_SHA256" \
            > "$RUNNER_TEMP/workbench-hard-cut/acceptance-preflight.json"

      - name: Enforce candidate-bound hard cut from independent evidence root
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/workbench-hard-cut/evidence
          TRUST_POLICY_PATH: ${{ runner.temp }}/workbench-hard-cut/production-trust-policy.json
          TRUST_POLICY_SHA256: ${{ vars.WORKBENCH_PRODUCTION_TRUST_POLICY_SHA256 }}
          CANDIDATE_ID: ${{ steps.release_chain.outputs.candidate_id }}
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          SIGNED_TAG: ${{ steps.release_chain.outputs.signed_tag }}
          RELEASE_CHAIN_ID: ${{ steps.release_chain.outputs.chain_id }}
          PRODUCTION_IMAGE_MANIFEST_PATH: ${{ runner.temp }}/workbench-production-images/artifact/production-image-manifest.json
          PRODUCTION_IMAGE_MANIFEST_SHA256: ${{ steps.g4.outputs.image_manifest_sha256 }}
          DEPLOYMENT_CONFIG_MANIFEST_PATH: ${{ runner.temp }}/workbench-deployment-config/artifact/production-deployment-config.json
          DEPLOYMENT_CONFIG_MANIFEST_SHA256: ${{ steps.deployment_config.outputs.manifest_sha256 }}
          CONTROL_CATALOG_PATH: ${{ github.workspace }}/schemas/evidence/governance/production-acceptance-control-catalog.v1.json
          CONTROL_CATALOG_SHA256: ${{ steps.g4.outputs.control_catalog_sha256 }}
        run: |
          set -euo pipefail
          npm run hard-cut:manifest -- \
            --root "$EVIDENCE_ROOT" \
            --manifest manifest.json \
            --enforce \
            --expected-candidate-id "$CANDIDATE_ID" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-signed-tag "$SIGNED_TAG" \
            --expected-release-chain-id "$RELEASE_CHAIN_ID" \
            --production-image-manifest "$PRODUCTION_IMAGE_MANIFEST_PATH" \
            --production-image-manifest-sha256 "$PRODUCTION_IMAGE_MANIFEST_SHA256" \
            --deployment-config-manifest "$DEPLOYMENT_CONFIG_MANIFEST_PATH" \
            --deployment-config-manifest-sha256 "$DEPLOYMENT_CONFIG_MANIFEST_SHA256" \
            --control-catalog "$CONTROL_CATALOG_PATH" \
            --control-catalog-sha256 "$CONTROL_CATALOG_SHA256" \
            --trust-policy "$TRUST_POLICY_PATH" \
            --trust-policy-sha256 "$TRUST_POLICY_SHA256" \
            > "$RUNNER_TEMP/workbench-hard-cut/hard-cut-enforce.json"

      - name: Write selected-run acceptance provenance
        env:
          OUTPUT_PATH: ${{ runner.temp }}/workbench-hard-cut/acceptance-run.json
          RELEASE_CHAIN_RUN_ID: ${{ inputs.release_chain_run_id }}
          RELEASE_CHAIN_RUN_ATTEMPT: ${{ steps.ci_run.outputs.run_attempt }}
          SOURCE_COMMIT: ${{ steps.release_chain.outputs.source_commit }}
          RELEASE_CHAIN_ID: ${{ steps.release_chain.outputs.chain_id }}
          IMAGE_MANIFEST_SHA256: ${{ steps.g4.outputs.image_manifest_sha256 }}
          DEPLOYMENT_CONFIG_MANIFEST_SHA256: ${{ steps.deployment_config.outputs.manifest_sha256 }}
          PACKAGE_SHA256: ${{ inputs.evidence_package_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = {
            schemaVersion: 'workbench.production-acceptance-run.v1',
            releaseChainRunId: process.env.RELEASE_CHAIN_RUN_ID,
            releaseChainRunAttempt: Number(process.env.RELEASE_CHAIN_RUN_ATTEMPT),
            sourceCommit: process.env.SOURCE_COMMIT,
            releaseChainId: process.env.RELEASE_CHAIN_ID,
            imageManifestSha256: process.env.IMAGE_MANIFEST_SHA256,
            deploymentConfigManifestSha256: process.env.DEPLOYMENT_CONFIG_MANIFEST_SHA256,
            packageSha256: process.env.PACKAGE_SHA256,
          };
          const canonical = (input) => Array.isArray(input)
            ? input.map(canonical)
            : input && typeof input === 'object'
              ? Object.fromEntries(Object.keys(input).sort().map((key) => [key, canonical(input[key])]))
              : input;
          fs.writeFileSync(process.env.OUTPUT_PATH, `${JSON.stringify(canonical(value))}\n`, { flag: 'wx', mode: 0o600 });
          NODE

      - name: Upload acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-production-acceptance-${{ inputs.release_chain_run_id }}-${{ steps.ci_run.outputs.run_attempt }}-${{ github.run_id }}
          path: ${{ runner.temp }}/workbench-hard-cut/*.json
          if-no-files-found: warn
