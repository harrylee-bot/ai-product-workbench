name: 产品工作台 CI

on:
  pull_request:
  push:
    branches:
      - main
      - production

concurrency:
  group: workbench-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-chain:
    name: Verify G0-G2 release chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      chain_id: ${{ steps.verify_release_chain.outputs.chain_id }}
      candidate_id: ${{ steps.verify_release_chain.outputs.candidate_id }}
      source_commit: ${{ steps.verify_release_chain.outputs.source_commit }}
      signed_tag: ${{ steps.verify_release_chain.outputs.signed_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate release-chain workflow contract
        run: npm run deployment:images:check

      - name: Test release-chain verifier
        run: npm run deployment:release-chain:test

      - name: Require immutable production base image inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          NODE_IMAGE: ${{ vars.WORKBENCH_NODE_IMAGE }}
          DEERFLOW_NODE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
          NGINX_IMAGE: ${{ vars.WORKBENCH_NGINX_IMAGE }}
          POSTGRES_IMAGE: ${{ vars.WORKBENCH_POSTGRES_IMAGE }}
          CI_POSTGRES_IMAGE: ${{ vars.WORKBENCH_CI_POSTGRES_IMAGE }}
          DOCLING_IMAGE: ${{ vars.WORKBENCH_DOCLING_IMAGE }}
          CLAMAV_IMAGE: ${{ vars.WORKBENCH_CLAMAV_IMAGE }}
          MINIO_IMAGE: ${{ vars.WORKBENCH_MINIO_IMAGE }}
          MINIO_MC_IMAGE: ${{ vars.WORKBENCH_MINIO_MC_IMAGE }}
          DEX_IMAGE: ${{ vars.WORKBENCH_DEX_IMAGE }}
        run: |
          set -euo pipefail
          require_digest() {
            name="$1"
            value="$2"
            test -n "$value" || { echo "$name is required on production" >&2; return 1; }
            printf '%s' "$value" | grep -Eq '@sha256:[a-f0-9]{64}$' || { echo "$name must be an immutable @sha256 reference" >&2; return 1; }
          }
          require_digest WORKBENCH_NODE_IMAGE "$NODE_IMAGE"
          require_digest WORKBENCH_DEERFLOW_NODE_IMAGE_REF "$DEERFLOW_NODE_IMAGE"
          require_digest WORKBENCH_NGINX_IMAGE "$NGINX_IMAGE"
          require_digest WORKBENCH_POSTGRES_IMAGE "$POSTGRES_IMAGE"
          require_digest WORKBENCH_CI_POSTGRES_IMAGE "$CI_POSTGRES_IMAGE"
          require_digest WORKBENCH_DOCLING_IMAGE "$DOCLING_IMAGE"
          require_digest WORKBENCH_CLAMAV_IMAGE "$CLAMAV_IMAGE"
          require_digest WORKBENCH_MINIO_IMAGE "$MINIO_IMAGE"
          require_digest WORKBENCH_MINIO_MC_IMAGE "$MINIO_MC_IMAGE"
          require_digest WORKBENCH_DEX_IMAGE "$DEX_IMAGE"

      - name: Download and hash approved G0-G2 artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          G0_URL: ${{ vars.WORKBENCH_G0_APPROVAL_URL }}
          G0_SHA256: ${{ vars.WORKBENCH_G0_APPROVAL_SHA256 }}
          G1_MANIFEST_URL: ${{ vars.WORKBENCH_G1_MANIFEST_URL }}
          G1_MANIFEST_SHA256: ${{ vars.WORKBENCH_G1_MANIFEST_SHA256 }}
          G1_INVENTORY_URL: ${{ vars.WORKBENCH_G1_INVENTORY_URL }}
          G1_INVENTORY_SHA256: ${{ vars.WORKBENCH_G1_INVENTORY_SHA256 }}
          G2_URL: ${{ vars.WORKBENCH_G2_RECEIPT_URL }}
          G2_SHA256: ${{ vars.WORKBENCH_G2_RECEIPT_SHA256 }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/workbench-release-chain-inputs"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"

          download_evidence() {
            name="$1"
            url="$2"
            expected="$3"
            destination="$evidence_dir/$name"
            test -n "$url" || { echo "$name URL is required" >&2; return 1; }
            test -n "$expected" || { echo "$name SHA-256 is required" >&2; return 1; }
            printf '%s' "$expected" | grep -Eq '^[a-f0-9]{64}$' || { echo "$name SHA-256 is invalid" >&2; return 1; }
            node -e 'const value=new URL(process.argv[1]); if(value.protocol!=="https:"||value.username||value.password||value.hash||[...value.searchParams.keys()].some((key)=>/(?:token|secret|credential|signature|sig|auth|key)/iu.test(key))) process.exit(1)' "$url" \
              || { echo "$name URL must be HTTPS, credential-free, and immutable without secret query parameters" >&2; return 1; }
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$destination" "$url"
            node -e 'const fs=require("node:fs");const crypto=require("node:crypto");const actual=crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");if(actual!==process.argv[2]){console.error(`hash mismatch: ${actual}`);process.exit(1)}' "$destination" "$expected"
            printf '%s\n' "$destination"
          }

          g0_path="$(download_evidence g0.json "$G0_URL" "$G0_SHA256")"
          g1_manifest_path="$(download_evidence g1-manifest.json "$G1_MANIFEST_URL" "$G1_MANIFEST_SHA256")"
          g1_inventory_path="$(download_evidence g1-inventory.ndjson "$G1_INVENTORY_URL" "$G1_INVENTORY_SHA256")"
          g2_path="$(download_evidence g2-receipt.json "$G2_URL" "$G2_SHA256")"

      - name: Verify approved G0-G2 release chain
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        id: verify_release_chain
        env:
          SIGNED_TAG: ${{ vars.WORKBENCH_RELEASE_SIGNED_TAG }}
          G0_SHA256: ${{ vars.WORKBENCH_G0_APPROVAL_SHA256 }}
          G1_MANIFEST_SHA256: ${{ vars.WORKBENCH_G1_MANIFEST_SHA256 }}
          G1_INVENTORY_SHA256: ${{ vars.WORKBENCH_G1_INVENTORY_SHA256 }}
          G2_SHA256: ${{ vars.WORKBENCH_G2_RECEIPT_SHA256 }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/workbench-release-chain-inputs"
          mkdir -p output
          node scripts/verify-release-chain.mjs \
            --g0 "$evidence_dir/g0.json" \
            --g1-manifest "$evidence_dir/g1-manifest.json" \
            --g1-inventory "$evidence_dir/g1-inventory.ndjson" \
            --g2 "$evidence_dir/g2-receipt.json" \
            --commit "$GITHUB_SHA" \
            --tag "$SIGNED_TAG" \
            --g0-sha256 "$G0_SHA256" \
            --g1-manifest-sha256 "$G1_MANIFEST_SHA256" \
            --g1-inventory-sha256 "$G1_INVENTORY_SHA256" \
            --g2-sha256 "$G2_SHA256" \
            > output/release-chain.json
          node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync("output/release-chain.json","utf8"));for(const [outputKey,valueKey] of [["chain_id","chainId"],["candidate_id","candidateId"],["source_commit","sourceCommit"],["signed_tag","signedTag"]]){if(typeof value[valueKey]!=="string"||value[valueKey].length===0)process.exit(1);console.log(`${outputKey}=${value[valueKey]}`)}' >> "$GITHUB_OUTPUT"
          artifact_dir="output/release-chain-to-sign"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          cp output/release-chain.json "$artifact_dir/release-chain.json"
          cp "$evidence_dir/g0.json" "$artifact_dir/g0.json"
          cp "$evidence_dir/g1-manifest.json" "$artifact_dir/g1-manifest.json"
          cp "$evidence_dir/g1-inventory.ndjson" "$artifact_dir/g1-inventory.ndjson"
          cp "$evidence_dir/g2-receipt.json" "$artifact_dir/g2-receipt.json"

      - name: Upload release chain for production-only signing
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-chain-to-sign-${{ github.run_attempt }}
          path: output/release-chain-to-sign/
          if-no-files-found: error

  release-chain-signing:
    name: Sign verified G0-G2 release chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [release-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact-attempt release chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-chain-to-sign-${{ github.run_attempt }}
          path: output/verified-release-chain

      - name: Install Cosign for release-chain attestation
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign and verify G0-G2 release chain
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle output/verified-release-chain/release-chain.bundle.json \
            output/verified-release-chain/release-chain.json
          cosign verify-blob \
            --bundle output/verified-release-chain/release-chain.bundle.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            output/verified-release-chain/release-chain.json

      - name: Upload verified release-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-chain-${{ github.run_attempt }}
          path: output/verified-release-chain/
          if-no-files-found: error

  quality:
    name: Contracts, architecture, tests, and build
    needs: [release-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pr_production_image_count: ${{ steps.affected_production_images.outputs.count }}
      pr_production_image_matrix: ${{ steps.affected_production_images.outputs.matrix }}
    services:
      postgres:
        image: ${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_CI_POSTGRES_IMAGE || 'pgvector/pgvector:pg16' }}
        env:
          POSTGRES_DB: workbench_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: true
      WORKBENCH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_test?schema=workbench
      WORKBENCH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_test?schema=workbench

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache pinned oasdiff release
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/workbench/tools/oasdiff
          key: oasdiff-${{ runner.os }}-${{ runner.arch }}-v1.23.0-resolver-v1

      - name: Install and verify pinned oasdiff
        run: npm run openapi:tool:prepare

      - name: Install dependencies
        run: npm ci

      - name: Prepare document renderer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-lxml python3-pil
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/workbench-export-python"
          "$RUNNER_TEMP/workbench-export-python/bin/python3" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes \
            -r deploy/workbench-export-python-requirements.txt
          "$RUNNER_TEMP/workbench-export-python/bin/python3" -c 'import docx, lxml, PIL'
          echo "$RUNNER_TEMP/workbench-export-python/bin" >> "$GITHUB_PATH"

      - name: Select affected PR production images
        id: affected_production_images
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          matrix="$(node scripts/production-image-inventory.mjs \
            --affected-matrix \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA")"
          count="$(node -e 'const matrix=JSON.parse(process.argv[1]); if (!Array.isArray(matrix.include)) process.exit(1); process.stdout.write(String(matrix.include.length))' "$matrix")"
          node -e 'const matrix=JSON.parse(process.argv[1]); console.log(`[pr-images] selected ${matrix.include.map((entry) => entry.name).join(",") || "none"}`)' "$matrix"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Prepare contracts and generated clients
        run: npm run workbench:prepare

      - name: Provision database extensions as CI infrastructure admin
        env:
          WORKBENCH_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_test
        run: npm run db:extensions:provision

      - name: Apply clean migrations and verify PostgreSQL constraints
        env:
          WORKBENCH_SCHEMA_RESET_CONFIRM: workbench_test
        run: npm run test:workbench:postgres-constraints

      - name: Reconcile runtime queue schema and policies
        env:
          WORKBENCH_MIGRATOR_DATABASE_URL: ${{ env.WORKBENCH_DATABASE_URL }}
        run: sh deploy/workbench-migrate.sh

      - name: Check generated OpenAPI
        run: npm run openapi:check

      - name: Reject breaking OpenAPI changes
        run: npm run openapi:breaking && npm run openapi:breaking:test

      - name: Check product naming
        run: npm run brand:check

      - name: Generate clean Web route types
        run: npm --workspace @workbench/web run typegen

      - name: Check types
        run: npm run typecheck:ci

      - name: Check Workbench lint
        run: npm run lint:workbench

      - name: Check Workbench module boundaries
        run: npm run architecture:workbench

      - name: Run server and worker tests
        run: npm test

      - name: Run Runtime provider-state PostgreSQL integration
        env:
          WORKBENCH_RUNTIME_ATTEMPT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_test?schema=runtime_provider_state_test
        run: |
          WORKBENCH_DATABASE_URL="$WORKBENCH_RUNTIME_ATTEMPT_TEST_DATABASE_URL" \
            npm --workspace @workbench/workbench-db run migrate:deploy
          npm --workspace @workbench/workbench-worker run test:postgres

      - name: Run real PostgreSQL API and Worker workflows
        env:
          WORKBENCH_SCHEMA_RESET_CONFIRM: workbench_test
        run: npm run test:workbench:postgres-http

      - name: Run candidate-bound File Worker PostgreSQL integration
        env:
          WORKBENCH_SCHEMA_RESET_CONFIRM: workbench_test
        run: npm --workspace @workbench/workbench-file-worker run test:postgres

      - name: Test trusted DeerFlow tools
        run: npm run deerflow:tools:test

      - name: Run Workbench Web tests
        run: npm --workspace @workbench/web run test

      - name: Install Workbench browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser-backed export integration
        env:
          WORKBENCH_RUN_BROWSER_INTEGRATION: "1"
        run: npm --workspace @workbench/workbench-export-worker test -- test/browser-export.integration.spec.ts

      - name: Run Workbench fixture browser smoke
        run: npm run e2e:web:fixture

      - name: Build production artifacts
        run: npm run build
        env:
          WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL: https://uploads.workbench.example.test/workbench
          WORKBENCH_TYPES_PREVALIDATED: "1"

      - name: Validate Workbench route bundles
        run: npm run bundle:workbench:check

  real-stack-browser:
    name: Real-stack browser / controlled-local-deerflow
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: workbench_real_stack_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workbench_real_stack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      WORKBENCH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_real_stack_test?schema=workbench
      WORKBENCH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_real_stack_test?schema=workbench
      WORKBENCH_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/workbench_real_stack_test
      WORKBENCH_SCHEMA_RESET_CONFIRM: workbench_real_stack_test
      WORKBENCH_E2E_REAL_STACK_BROWSER: "1"
      WORKBENCH_E2E_REAL_STACK_BROWSER_ONLY: "1"
      WORKBENCH_E2E_RECOVERY_TIMEOUT_MS: "360000"
      WORKBENCH_E2E_CONTROLLED_PROVIDER: controlled-local-deerflow
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare contracts and generated clients
        run: npm run workbench:prepare
        env:
          WORKBENCH_DATABASE_URL: ${{ env.WORKBENCH_DATABASE_URL }}

      - name: Provision PostgreSQL extensions
        run: npm run db:extensions:provision

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run real-stack browser-only smoke
        run: npm run e2e:web:real-stack:browser-only

      - name: Upload real-stack browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-stack-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: output/playwright/real-stack/**
          if-no-files-found: warn
          retention-days: 14

  deployment-config:
    name: Compose, gateways, and Quartz behavior
    needs: [release-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install deployment verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate greenfield Compose model
        run: >-
          docker compose
          --env-file deploy/workbench.env.example
          --file deploy/workbench-compose.yml
          --profile "*"
          config --quiet

      - name: Validate browser upload deployment contract
        run: npm run deployment:upload:check

      - name: Validate authentication proxy trust contract
        run: npm run deployment:auth-proxy:check

      - name: Validate deployment network boundaries
        run: npm run deployment:network:check

      - name: Validate production image inventory and evidence workflow
        run: npm run deployment:images:check

      - name: Test signed deployment configuration and G12 image evidence
        run: npm run deployment:config:test

      - name: Validate clean-host deployment orchestration
        run: npm run deployment:orchestration:check

      - name: Validate primary gateway configuration
        env:
          NGINX_IMAGE: ${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NGINX_IMAGE || 'nginx:stable-alpine' }}
        run: >-
          docker run --rm
          --add-host workbench-web:127.0.0.1
          --add-host workbench-api:127.0.0.1
          --add-host knowledge:127.0.0.1
          --volume "$PWD/deploy/workbench-nginx.conf:/etc/nginx/nginx.conf:ro"
          "$NGINX_IMAGE" nginx -t

      - name: Validate isolated Preview gateway configuration
        env:
          NGINX_IMAGE: ${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NGINX_IMAGE || 'nginx:stable-alpine' }}
        run: >-
          docker run --rm
          --add-host workbench-preview:127.0.0.1
          --volume "$PWD/deploy/workbench-preview-nginx.conf:/etc/nginx/nginx.conf:ro"
          "$NGINX_IMAGE" nginx -t

      - name: Validate immutable Quartz source and plugin pins
        run: npm run knowledge:assert-pinned

      - name: Test Quartz watcher atomic publication and shutdown
        run: bash apps/knowledge/test-quartz-watcher.sh

  pr-production-images:
    name: PR production image / ${{ matrix.name }}
    if: github.event_name == 'pull_request' && needs.quality.outputs.pr_production_image_count != '0'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.pr_production_image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and probe production target without publishing
        env:
          DEERFLOW_BASE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
          DEERFLOW_NODE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
          DEERFLOW_SOURCE_COMMIT: ${{ vars.WORKBENCH_DEERFLOW_COMMIT }}
          NODE_IMAGE: ${{ vars.WORKBENCH_NODE_IMAGE }}
          NGINX_IMAGE: ${{ vars.WORKBENCH_NGINX_IMAGE }}
        run: |
          set -euo pipefail
          tag="workbench-pr-${{ matrix.name }}:${GITHUB_SHA}"
          args=()
          require_digest() {
            name="$1"
            value="$2"
            test -n "$value" || { echo "$name is required for the PR production image build" >&2; return 1; }
            printf '%s' "$value" | grep -Eq '@sha256:[a-f0-9]{64}$' || { echo "$name must be an immutable @sha256 reference" >&2; return 1; }
          }
          case "${{ matrix.name }}" in
            web)
              require_digest WORKBENCH_NODE_IMAGE "$NODE_IMAGE"
              args+=(
                --build-arg NODE_IMAGE="$NODE_IMAGE"
                --build-arg WORKBENCH_PREVIEW_ORIGIN=https://preview.workbench.example.test
                --build-arg WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL=https://uploads.workbench.example.test/workbench
                --build-arg NEXT_PUBLIC_KNOWLEDGE_APP_URL=https://workbench.example.test/knowledge
              )
              ;;
            quartz)
              require_digest WORKBENCH_NODE_IMAGE "$NODE_IMAGE"
              require_digest WORKBENCH_NGINX_IMAGE "$NGINX_IMAGE"
              args+=(
                --build-arg NODE_IMAGE="$NODE_IMAGE"
                --build-arg NGINX_IMAGE="$NGINX_IMAGE"
                --build-arg QUARTZ_BASE_URL=workbench.example.test/knowledge
                --build-arg KNOWLEDGE_WEB_URL=https://workbench.example.test
              )
              ;;
            deerflow)
              require_digest WORKBENCH_DEERFLOW_BASE_IMAGE_REF "$DEERFLOW_BASE_IMAGE"
              require_digest WORKBENCH_DEERFLOW_NODE_IMAGE_REF "$DEERFLOW_NODE_IMAGE"
              printf '%s' "$DEERFLOW_SOURCE_COMMIT" | grep -Eq '^[a-f0-9]{40}$'
              args=(
                --build-arg DEERFLOW_BASE_IMAGE="$DEERFLOW_BASE_IMAGE"
                --build-arg DEERFLOW_NODE_IMAGE="$DEERFLOW_NODE_IMAGE"
                --build-arg DEERFLOW_SOURCE_COMMIT="$DEERFLOW_SOURCE_COMMIT"
                --build-arg WORKBENCH_SOURCE_COMMIT="$GITHUB_SHA"
              )
              ;;
            *)
              require_digest WORKBENCH_NODE_IMAGE "$NODE_IMAGE"
              args+=(--build-arg NODE_IMAGE="$NODE_IMAGE")
              ;;
          esac
          docker buildx build \
            --load \
            --file "${{ matrix.dockerfile }}" \
            --target "${{ matrix.target }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$tag" \
            "${args[@]}" \
            "${{ matrix.context }}"
          docker image inspect "$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"

          probe_log="$(mktemp)"
          probe_container=""
          cleanup_probe() {
            if [ -n "$probe_container" ]; then
              docker rm --force "$probe_container" >/dev/null 2>&1 || true
            fi
            rm -f "$probe_log"
          }
          trap cleanup_probe EXIT
          expect_config_failure() {
            expected="$1"
            shift
            : > "$probe_log"
            if docker run --rm --network none "$@" "$tag" >"$probe_log" 2>&1; then
              echo "production command unexpectedly started without required configuration" >&2
              return 1
            fi
            grep -Fq "$expected" "$probe_log"
          }
          start_probe_container() {
            probe_container="$(docker run --rm --network none --detach "$@" "$tag")"
          }
          stop_probe_container() {
            docker stop --timeout 5 "$probe_container" >/dev/null
            probe_container=""
          }

          case "${{ matrix.probe }}" in
            node-config-fail-fast)
              test -n "${{ matrix.command_path }}"
              docker image inspect "$tag" --format '{{json .Config.Cmd}}' \
                | grep -Fx "[\"node\",\"${{ matrix.command_path }}\"]"
              docker run --rm --network none --entrypoint node "$tag" \
                --check "${{ matrix.command_path }}"
              expect_config_failure "Missing WORKBENCH_DATABASE_URL" \
                --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp
              ;;
            migrator-config-fail-fast)
              docker image inspect "$tag" --format '{{json .Config.Entrypoint}}' \
                | grep -Fx '["/app/deploy/workbench-migrate.sh"]'
              docker run --rm --network none --entrypoint /bin/sh "$tag" \
                -n /app/deploy/workbench-migrate.sh
              expect_config_failure "WORKBENCH_DATABASE_URL (migrator URL) is required" \
                --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp
              ;;
            next-startup)
              docker image inspect "$tag" --format '{{json .Config.Cmd}}' \
                | grep -Fx '["npx","next","start","--hostname","0.0.0.0","--port","3000"]'
              start_probe_container \
                --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp
              ready=0
              for _ in $(seq 1 30); do
                if docker exec "$probe_container" node -e \
                  "const net=require('node:net');const socket=net.connect(3000,'127.0.0.1');socket.once('connect',()=>socket.destroy());socket.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000).unref()"; then
                  ready=1
                  break
                fi
                sleep 1
              done
              test "$ready" = 1 || { docker logs "$probe_container" >&2; exit 1; }
              stop_probe_container
              ;;
            nginx-startup)
              docker image inspect "$tag" --format '{{json .Config.Entrypoint}}' \
                | grep -Fx '["nginx","-g","daemon off;"]'
              quartz_runtime_args=(
                --read-only
                --cap-drop ALL
                --security-opt no-new-privileges:true
                --tmpfs /var/cache/nginx:uid=101,gid=101,mode=1770
                --tmpfs /var/run:uid=101,gid=101,mode=1770
                --tmpfs /tmp:uid=101,gid=101,mode=1770
              )
              docker run --rm --network none "${quartz_runtime_args[@]}" \
                --entrypoint nginx "$tag" -t
              start_probe_container "${quartz_runtime_args[@]}"
              ready=0
              for _ in $(seq 1 20); do
                if docker exec "$probe_container" wget -q -O /dev/null http://127.0.0.1:3000/__health; then
                  ready=1
                  break
                fi
                sleep 1
              done
              test "$ready" = 1 || { docker logs "$probe_container" >&2; exit 1; }
              stop_probe_container
              ;;
            deerflow-runtime-syntax)
              docker image inspect "$tag" --format '{{.Config.User}}' | grep -Fx '65532:65532'
              docker run --rm --network none \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges:true \
                --tmpfs /tmp:size=1073741824,uid=65532,gid=65532,mode=1770 \
                --env UV_CACHE_DIR=/tmp/uv-cache \
                --entrypoint /bin/sh "$tag" -ec \
                'cd /app/backend
                 uv run --no-sync uvicorn --help >/dev/null
                 PYTHONPATH=/app/backend/packages/harness:/app/backend uv run --no-sync python -c "from deerflow_workbench_tools.runtime_result_validator import validate_runtime_result; assert validate_runtime_result({})[\"ok\"] is False"'
              ;;
            *)
              echo "unsupported production image probe: ${{ matrix.probe }}" >&2
              exit 1
              ;;
          esac

  production-images:
    name: Production image / ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [release-chain, release-chain-signing, quality, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            target: runner
            build_args: |
              WORKBENCH_PREVIEW_ORIGIN=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_PREVIEW_ORIGIN || 'https://preview.workbench.example.test' }}
              WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL || 'https://uploads.workbench.example.test/workbench' }}
              NEXT_PUBLIC_KNOWLEDGE_APP_URL=${{ github.ref == 'refs/heads/production' && format('https://{0}', vars.WORKBENCH_KNOWLEDGE_BASE_URL) || 'https://workbench.example.test/knowledge' }}
              NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL=${{ github.ref == 'refs/heads/production' && vars.NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL || '' }}
              NEXT_PUBLIC_WORKBENCH_FORUM_URL=${{ github.ref == 'refs/heads/production' && vars.NEXT_PUBLIC_WORKBENCH_FORUM_URL || '' }}
              NEXT_PUBLIC_WORKBENCH_PRIVACY_URL=${{ github.ref == 'refs/heads/production' && vars.NEXT_PUBLIC_WORKBENCH_PRIVACY_URL || '' }}
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: api
            dockerfile: apps/workbench-api/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: api-migrator
            dockerfile: apps/workbench-api/Dockerfile
            target: migrator
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: runtime-worker
            dockerfile: apps/workbench-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: file-worker
            dockerfile: apps/workbench-file-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: import-worker
            dockerfile: apps/workbench-import-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: export-worker
            dockerfile: apps/workbench-export-worker/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: preview
            dockerfile: apps/workbench-preview/Dockerfile
            target: runner
            build_args: |
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
          - name: quartz
            dockerfile: apps/knowledge/Dockerfile
            target: immutable-runner
            build_args: |
              QUARTZ_BASE_URL=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_KNOWLEDGE_BASE_URL || 'workbench.example.test/knowledge' }}
              KNOWLEDGE_WEB_URL=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_WEB_ORIGIN || 'https://workbench.example.test' }}
              NODE_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NODE_IMAGE || 'node:22-alpine' }}
              NGINX_IMAGE=${{ github.ref == 'refs/heads/production' && vars.WORKBENCH_NGINX_IMAGE || 'nginx:stable-alpine' }}
          - name: deerflow
            dockerfile: integrations/deerflow/Dockerfile
            target: runtime
            build_args: |
              DEERFLOW_BASE_IMAGE=${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
              DEERFLOW_NODE_IMAGE=${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
              DEERFLOW_SOURCE_COMMIT=${{ vars.WORKBENCH_DEERFLOW_COMMIT }}
              WORKBENCH_SOURCE_COMMIT=${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Require approved production build inputs
        if: github.ref == 'refs/heads/production'
        env:
          WORKBENCH_WEB_ORIGIN: ${{ vars.WORKBENCH_WEB_ORIGIN }}
          WORKBENCH_PREVIEW_ORIGIN: ${{ vars.WORKBENCH_PREVIEW_ORIGIN }}
          WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL: ${{ vars.WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL }}
          WORKBENCH_KNOWLEDGE_BASE_URL: ${{ vars.WORKBENCH_KNOWLEDGE_BASE_URL }}
          WORKBENCH_PUBLIC_REGISTRATION_ENABLED: ${{ vars.WORKBENCH_PUBLIC_REGISTRATION_ENABLED }}
          NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_FEEDBACK_URL }}
          NEXT_PUBLIC_WORKBENCH_FORUM_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_FORUM_URL }}
          NEXT_PUBLIC_WORKBENCH_PRIVACY_URL: ${{ vars.NEXT_PUBLIC_WORKBENCH_PRIVACY_URL }}
        run: |
          case "$WORKBENCH_WEB_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          case "$WORKBENCH_PREVIEW_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          case "$WORKBENCH_S3_BROWSER_UPLOAD_BUCKET_URL" in https://*) ;; *) exit 1 ;; esac
          test "$WORKBENCH_WEB_ORIGIN" != "$WORKBENCH_PREVIEW_ORIGIN"
          test -n "$WORKBENCH_KNOWLEDGE_BASE_URL"
          case "$WORKBENCH_KNOWLEDGE_BASE_URL" in http://*|https://*|/*|*' '*) exit 1 ;; esac
          case "$WORKBENCH_PUBLIC_REGISTRATION_ENABLED" in true|false) ;; *) exit 1 ;; esac

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require fixed DeerFlow source and base image pins
        if: matrix.name == 'deerflow' && github.ref == 'refs/heads/production'
        env:
          DEERFLOW_BASE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_BASE_IMAGE_REF }}
          DEERFLOW_NODE_IMAGE: ${{ vars.WORKBENCH_DEERFLOW_NODE_IMAGE_REF }}
          DEERFLOW_SOURCE_COMMIT: ${{ vars.WORKBENCH_DEERFLOW_COMMIT }}
        run: |
          test -n "$DEERFLOW_BASE_IMAGE"
          printf '%s' "$DEERFLOW_BASE_IMAGE" | grep -Eq '@sha256:[a-f0-9]{64}$'
          test -n "$DEERFLOW_NODE_IMAGE"
          printf '%s' "$DEERFLOW_NODE_IMAGE" | grep -Eq '@sha256:[a-f0-9]{64}$'
          printf '%s' "$DEERFLOW_SOURCE_COMMIT" | grep -Eq '^[a-f0-9]{40}$'

      - name: Prepare image evidence directory
        run: mkdir -p output

      - name: Freeze public image build configuration
        if: matrix.name != 'deerflow' || github.ref == 'refs/heads/production'
        id: build-configuration
        env:
          WORKBENCH_IMAGE_BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          path="output/build-configuration-${{ matrix.name }}.json"
          node scripts/write-production-build-configuration.mjs \
            --id "${{ matrix.name }}" \
            --source-commit "$GITHUB_SHA" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --target "${{ matrix.target }}" \
            --build-args-env WORKBENCH_IMAGE_BUILD_ARGS \
            > "$path"
          sha256="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(value.payloadSha256)' "$path")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} production image
        if: matrix.name != 'deerflow' || github.ref == 'refs/heads/production'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.workbench.build-configuration-sha256=${{ steps.build-configuration.outputs.sha256 }}
          tags: ghcr.io/${{ github.repository_owner }}/workbench-${{ matrix.name }}:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/production' }}
          load: ${{ github.ref != 'refs/heads/production' }}
          provenance: ${{ github.ref == 'refs/heads/production' && 'mode=max' || false }}
          sbom: ${{ github.ref == 'refs/heads/production' }}
          metadata-file: output/build-metadata.json
          cache-from: type=gha,scope=workbench-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=workbench-${{ matrix.name }},ignore-error=true

      - name: Resolve image reference
        if: matrix.name != 'deerflow' || github.ref == 'refs/heads/production'
        id: image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/workbench-${{ matrix.name }}:${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/production" ]; then
            ref="$ref@${{ steps.build.outputs.digest }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        if: matrix.name != 'deerflow' || github.ref == 'refs/heads/production'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.ref }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: output/sbom-${{ matrix.name }}.spdx.json

      - name: Scan image for release-blocking vulnerabilities
        if: matrix.name != 'deerflow' || github.ref == 'refs/heads/production'
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: json
          output: output/trivy-${{ matrix.name }}.json
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Publish signed build provenance attestation
        if: github.ref == 'refs/heads/production'
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/workbench-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Capture signed build provenance bundle
        if: github.ref == 'refs/heads/production'
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$PROVENANCE_BUNDLE"
          cp "$PROVENANCE_BUNDLE" "output/provenance-${{ matrix.name }}.bundle.json"

      - name: Publish signed SBOM attestation
        if: github.ref == 'refs/heads/production'
        id: sbom_attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/workbench-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: output/sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true

      - name: Capture signed SBOM attestation bundle
        if: github.ref == 'refs/heads/production'
        env:
          SBOM_ATTESTATION_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          test -s "$SBOM_ATTESTATION_BUNDLE"
          cp "$SBOM_ATTESTATION_BUNDLE" "output/sbom-attestation-${{ matrix.name }}.bundle.json"

      - name: Install Cosign
        if: github.ref == 'refs/heads/production'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign and verify immutable image
        if: github.ref == 'refs/heads/production'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
        run: |
          cosign sign --yes --bundle "output/cosign-${{ matrix.name }}.bundle.json" "$IMAGE_REF"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output-file "output/cosign-${{ matrix.name }}.verify.json" \
            "$IMAGE_REF"

      - name: Write immutable image evidence record
        if: github.ref == 'refs/heads/production'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/write-production-image-record.mjs \
            --id "${{ matrix.name }}" \
            --image-ref "$IMAGE_REF" \
            --digest "$IMAGE_DIGEST" \
            --source-commit "$GITHUB_SHA" \
            --build-configuration-path "${{ steps.build-configuration.outputs.path }}" \
            --sbom-path "output/sbom-${{ matrix.name }}.spdx.json" \
            --sbom-attestation-path "output/sbom-attestation-${{ matrix.name }}.bundle.json" \
            --provenance-path "output/provenance-${{ matrix.name }}.bundle.json" \
            --signature-path "output/cosign-${{ matrix.name }}.bundle.json" \
            --verification-path "output/cosign-${{ matrix.name }}.verify.json" \
            --vulnerability-path "output/trivy-${{ matrix.name }}.json" \
            > "output/image-record-${{ matrix.name }}.json"

      - name: Upload image evidence
        if: always() && (matrix.name != 'deerflow' || github.ref == 'refs/heads/production')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-evidence-${{ github.run_attempt }}-${{ matrix.name }}
          path: output/
          if-no-files-found: error

  image-evidence:
    name: Assemble signed production image inventory
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [production-images, release-chain, release-chain-signing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install manifest verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download signed image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: production-image-evidence-${{ github.run_attempt }}-*
          path: output/image-evidence
          merge-multiple: true

      - name: Assemble candidate-bound image manifest
        run: |
          node scripts/production-image-inventory.mjs --contract
          records=()
          while IFS= read -r -d '' record; do records+=(--record "$record"); done < <(find output/image-evidence -name 'image-record-*.json' -print0)
          node scripts/production-image-inventory.mjs --assemble \
            --expected-commit "$GITHUB_SHA" \
            --release-chain-id "${{ needs['release-chain'].outputs.chain_id }}" \
            "${records[@]}" \
            > output/production-image-manifest.json
          bundles=(output/image-evidence/cosign-*.bundle.json)
          test "${#bundles[@]}" -eq 10
          cp "${bundles[@]}" output/

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign and verify candidate image manifest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob --yes \
            --bundle output/production-image-manifest.bundle.json \
            output/production-image-manifest.json
          cosign verify-blob \
            --bundle output/production-image-manifest.bundle.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            output/production-image-manifest.json

      - name: Upload candidate image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-manifest-${{ github.run_attempt }}
          path: |
            output/production-image-manifest.json
            output/production-image-manifest.bundle.json
            output/cosign-*.bundle.json
          if-no-files-found: error

  deployment-config-evidence:
    name: Sign candidate-bound production deployment configuration
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [release-chain, release-chain-signing, image-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install deployment-config verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download exact-attempt G4 image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-image-manifest-${{ github.run_attempt }}
          path: output/production-images

      - name: Create candidate-bound deployment configuration
        env:
          CANDIDATE_ID: ${{ needs.release-chain.outputs.candidate_id }}
          SIGNED_TAG: ${{ needs.release-chain.outputs.signed_tag }}
          RELEASE_CHAIN_ID: ${{ needs.release-chain.outputs.chain_id }}
          WORKBENCH_POSTGRES_IMAGE: ${{ vars.WORKBENCH_POSTGRES_IMAGE }}
          WORKBENCH_NGINX_IMAGE: ${{ vars.WORKBENCH_NGINX_IMAGE }}
          WORKBENCH_DOCLING_IMAGE: ${{ vars.WORKBENCH_DOCLING_IMAGE }}
          WORKBENCH_CLAMAV_IMAGE: ${{ vars.WORKBENCH_CLAMAV_IMAGE }}
          WORKBENCH_MINIO_IMAGE: ${{ vars.WORKBENCH_MINIO_IMAGE }}
          WORKBENCH_MINIO_MC_IMAGE: ${{ vars.WORKBENCH_MINIO_MC_IMAGE }}
          WORKBENCH_DEX_IMAGE: ${{ vars.WORKBENCH_DEX_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p output/deployment-config
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import { createProductionDeploymentConfig, verifyProductionDeploymentConfig } from './scripts/production-deployment-config.mjs';
          const imageManifestPath = 'output/production-images/production-image-manifest.json';
          const imageManifestBytes = fs.readFileSync(imageManifestPath);
          const imageManifest = JSON.parse(imageManifestBytes.toString('utf8'));
          const document = createProductionDeploymentConfig({
            candidateId: process.env.CANDIDATE_ID,
            sourceCommit: process.env.GITHUB_SHA,
            signedTag: process.env.SIGNED_TAG,
            releaseChainId: process.env.RELEASE_CHAIN_ID,
            imageManifest,
            imageManifestSha256: createHash('sha256').update(imageManifestBytes).digest('hex'),
            githubRunId: process.env.GITHUB_RUN_ID,
            githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
          });
          verifyProductionDeploymentConfig(document, {
            candidateId: process.env.CANDIDATE_ID,
            sourceCommit: process.env.GITHUB_SHA,
            signedTag: process.env.SIGNED_TAG,
            releaseChainId: process.env.RELEASE_CHAIN_ID,
            githubRunId: process.env.GITHUB_RUN_ID,
            githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
          }, { repoRoot: process.env.GITHUB_WORKSPACE, verifySourceFiles: true });
          fs.writeFileSync('output/deployment-config/production-deployment-config.json', `${JSON.stringify(document, null, 2)}\n`, { flag: 'wx' });
          NODE

      - name: Install Cosign for deployment configuration
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign and verify deployment configuration
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/workbench-ci.yml@refs/heads/production
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          manifest=output/deployment-config/production-deployment-config.json
          bundle=output/deployment-config/production-deployment-config.bundle.json
          cosign sign-blob --yes --bundle "$bundle" "$manifest"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$manifest"

      - name: Upload signed deployment configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-config-${{ github.run_attempt }}
          path: output/deployment-config/
          if-no-files-found: error
