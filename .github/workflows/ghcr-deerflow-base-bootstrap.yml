name: One-time GHCR DeerFlow digest verification

on:
  push:
    branches:
      - codex/ghcr-bootstrap-2665575f

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Resolve immutable DeerFlow base digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to GHCR with this run only
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username harrylee-bot --password-stdin

      - name: Resolve the tag and exact digest from GHCR
        run: |
          set -euo pipefail
          image="ghcr.io/harrylee-bot/workbench-deerflow-base"
          tag="7a6c4a994a86583d2a3c056ee9d0f157d4f030c2"
          expected="sha256:fe30626a3de0a3889f4d05578ed1bdb915298ff5610967c04e664a5181d19090"
          docker buildx imagetools inspect "$image@$expected" >/dev/null
          actual="$(docker buildx imagetools inspect "$image:$tag" | awk '$1 == "Digest:" { print $2; exit }')"
          test "$actual" = "$expected"
          printf 'verifiedDigest=%s\n' "$actual"

      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
